<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>tebriklerrr</title>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        canvas { background: #222; border: 3px solid #fff; margin-top: 20px; }
        h1 { margin-top: 10px; color: #ff4757; }
    </style>
</head>
<body>

    <h1>İLAYDAYA AŞIK</h1>
    <p>Mavi: W,A,S,D | Kırmızı: Ok Tuşları</p>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = 800;
canvas.height = 400;

// Tuş kontrol sistemi (Hatasız)
const keys = {};
window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; keys[e.code] = true; });
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; keys[e.code] = false; });

class Player {
    constructor(x, y, color, up, left, right) {
        this.x = x; this.y = y;
        this.w = 30; this.h = 30;
        this.color = color;
        this.up = up; this.left = left; this.right = right;
        this.velX = 0; this.velY = 0;
        this.jump = false;
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.w, this.h);
    }

    update() {
        // Hareketler
        if (keys[this.left]) this.velX = -4;
        else if (keys[this.right]) this.velX = 4;
        else this.velX = 0;

        if (keys[this.up] && !this.jump) {
            this.velY = -12;
            this.jump = true;
        }

        this.velY += 0.6; // Yerçekimi
        this.x += this.velX;
        this.y += this.velY;

        // Platform Çarpışması (Basit zemin kontrolü)
        if (this.y > 350) {
            this.y = 350;
            this.velY = 0;
            this.jump = false;
        }

        // Platformlar
        platforms.forEach(p => {
            if (this.x < p.x + p.w && this.x + this.w > p.x && this.y + this.h > p.y && this.y < p.y + p.h) {
                if (this.velY > 0) {
                    this.y = p.y - this.h;
                    this.velY = 0;
                    this.jump = false;
                }
            }
        });

        // Kazanma kontrolü
        if (this.x > 740 && this.y < 100) {
            alert("İLAYDAYA AŞIK KAZANDI!");
            this.x = 20; this.y = 350;
        }
    }
}

const platforms = [
    {x: 100, y: 300, w: 100, h: 15},
    {x: 300, y: 230, w: 100, h: 15},
    {x: 500, y: 160, w: 100, h: 15},
    {x: 700, y: 100, w: 100, h: 15}
];

// Mavi karakter (W,A,S,D) | Kırmızı karakter (Ok Tuşları)
const p1 = new Player(20, 350, "#3498db", "w", "a", "d");
const p2 = new Player(60, 350, "#e74c3c", "ArrowUp", "ArrowLeft", "ArrowRight");

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Zemin
    ctx.fillStyle = "#555";
    ctx.fillRect(0, 380, 800, 20);

    // Platformları çiz
    ctx.fillStyle = "white";
    platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

    // Bitiş (Altın blok)
    ctx.fillStyle = "gold";
    ctx.fillRect(750, 50, 40, 40);

    p1.update(); p1.draw();
    p2.update(); p2.draw();

    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
