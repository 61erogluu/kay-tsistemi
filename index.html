<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO-FIX</title>

<style>
:root{
--bg:#0d0d0f;
--card:#1c1c1f;
--blue:#0a84ff;
--border:#333;
}

body{margin:0;font-family:-apple-system;background:var(--bg);color:white;}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:var(--card);
}

.icons{display:flex;gap:12px;font-size:22px;cursor:pointer;}

.container{padding:15px;}

input,select{
width:100%;
padding:14px;
margin-top:10px;
background:var(--card);
border:1px solid var(--border);
border-radius:10px;
color:white;
font-size:16px;
}

button{
width:100%;
padding:16px;
margin-top:20px;
background:var(--blue);
border:none;
border-radius:12px;
color:white;
font-weight:bold;
}

.sidebar{
position:fixed;
top:0;
right:-100%;
width:100%;
height:100%;
background:var(--bg);
padding:20px;
transition:0.3s;
overflow:auto;
z-index:10;
}

.sidebar.open{right:0;}

.record{
background:var(--card);
padding:12px;
border-radius:10px;
margin-top:10px;
}

.close{
font-size:18px;
margin-bottom:10px;
cursor:pointer;
color:red;
}
</style>
</head>

<body>

<div class="header">
<h2>PRO-FIX</h2>

<div class="icons">
<div onclick="openUsta()">👤</div>
<div onclick="toggleMenu(true)">☰</div>
</div>
</div>

<div class="container">

<input id="device" placeholder="Cihaz Model">
<input id="code" placeholder="Servis Kodu">

<select id="usta">
<option value="">Usta seç</option>
<option>Kadir</option>
<option>Mehmet</option>
</select>

<select id="islem">
<option value="">İşlem seç</option>
<option>BGA</option>
<option>EMMC</option>
</select>

<button onclick="save()">Kaydet</button>

</div>

<!-- KAYIT PANEL -->
<div class="sidebar" id="menu">
<div class="close" onclick="toggleMenu(false)">Kapat</div>

<input id="search" placeholder="Ara..." onkeyup="render()">
<div id="list"></div>
</div>

<!-- USTA PANEL -->
<div class="sidebar" id="ustaPanel">
<div class="close" onclick="toggleUsta(false)">Kapat</div>

<h3>Usta Performans</h3>

<select id="ustaSec">
<option value="">Usta</option>
<option>Kadir</option>
<option>Mehmet</option>
</select>

<select id="zaman">
<option value="today">Bugün</option>
<option value="month">Bu Ay</option>
<option value="custom">Özel</option>
</select>

<input type="date" id="start">
<input type="date" id="end">

<button onclick="hesapla()">Hesapla</button>

<h2 id="sonuc"></h2>

</div>

<script>

let db=JSON.parse(localStorage.getItem("db"))||[];

// KAYDET
function save(){
let d=device.value;
let c=code.value;
let u=usta.value;
let i=islem.value;

if(!d||!c||!u||!i){alert("Eksik alan");return;}

db.unshift({device:d,code:c,usta:u,islem:i,date:new Date().toISOString()});
localStorage.setItem("db",JSON.stringify(db));

device.value="";
code.value="";
usta.value="";
islem.value="";

render();
alert("Kaydedildi");
}

// MENÜ
function toggleMenu(x){
menu.className=x?"sidebar open":"sidebar";
render();
}

// USTA PANELİ (ŞİFRELİ)
function openUsta(){
let s=prompt("Şifre");
if(btoa(s)==="MTYxNg=="){
toggleUsta(true);
}else{
alert("Yanlış şifre");
}
}

function toggleUsta(x){
ustaPanel.className=x?"sidebar open":"sidebar";
}

// LİSTE
function render(){
let t=search.value||"";
list.innerHTML="";

db.filter(x=>x.device.includes(t)||x.code.includes(t)||x.usta.includes(t))
.forEach(x=>{
let div=document.createElement("div");
div.className="record";
div.innerHTML=`${x.code} - ${x.device}<br>${x.usta} | ${x.islem}`;
list.appendChild(div);
});
}

// ANALİZ
function hesapla(){

let u=ustaSec.value;
let z=zaman.value;
let s=start.value;
let e=end.value;

let now=new Date();
let say=0;

db.forEach(x=>{
let d=new Date(x.date);

if(u && x.usta!==u) return;

if(z==="today"){
if(d.toDateString()===now.toDateString()) say++;
}
else if(z==="month"){
if(d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear()) say++;
}
else if(z==="custom"){
if(s && e){
if(d>=new Date(s) && d<=new Date(e)) say++;
}
}
});

sonuc.innerText="Toplam İş: "+say;
}

render();

</script>

</body>
</html>
