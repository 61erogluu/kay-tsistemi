<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PRO-FIX | Profesyonel Servis Takip</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- FIREBASE - SENİN GERÇEK ANAHTARLARIN -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0c;
            color: #ffffff;
            min-height: 100vh;
            background: linear-gradient(145deg, #0a0a0c 0%, #1a1a1f 100%);
        }

        .header {
            background: rgba(22, 22, 26, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            font-size: 28px;
            color: #0a84ff;
            filter: drop-shadow(0 0 10px rgba(10, 132, 255, 0.5));
        }

        .logo h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a8a8a8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu-btn {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .menu-btn:active {
            background: rgba(10, 132, 255, 0.2);
            transform: scale(0.95);
        }

        /* BULUT DURUM GÖSTERGESİ */
        .cloud-status {
            background: rgba(10, 132, 255, 0.1);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(10, 132, 255, 0.3);
        }

        .cloud-status i {
            font-size: 14px;
            color: #0a84ff;
        }

        .online {
            color: #32d74b;
        }

        .offline {
            color: #ff453a;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: rgba(28, 28, 33, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8e8e93;
        }

        .section-title i {
            font-size: 16px;
            color: #0a84ff;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #98989d;
            margin-bottom: 6px;
            margin-left: 4px;
        }

        input, select, textarea {
            width: 100%;
            padding: 16px;
            background: #1c1c1f;
            border: 1.5px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0a84ff;
            background: #23232a;
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.1);
        }

        input::placeholder, textarea::placeholder {
            color: #3a3a40;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 18px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #0a84ff;
            color: white;
            box-shadow: 0 10px 20px rgba(10, 132, 255, 0.3);
            margin: 8px 0;
        }

        .btn:active {
            transform: scale(0.98);
            box-shadow: 0 5px 10px rgba(10, 132, 255, 0.2);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(28, 28, 33, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #0a84ff;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 13px;
            color: #8e8e93;
        }

        .chart-container {
            background: rgba(28, 28, 33, 0.3);
            border-radius: 20px;
            padding: 15px;
            margin-top: 20px;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: #16161a;
            z-index: 1000;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px;
            overflow-y: auto;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .close-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            cursor: pointer;
        }

        .record-card {
            background: #1c1c1f;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .record-code {
            font-size: 18px;
            font-weight: 700;
            color: #0a84ff;
            letter-spacing: 1px;
        }

        .record-badge {
            padding: 6px 12px;
            background: rgba(10, 132, 255, 0.1);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #0a84ff;
        }

        .record-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 12px 0;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 12px;
        }

        .detail-item i {
            font-size: 14px;
            color: #0a84ff;
        }

        .detail-item span {
            font-size: 11px;
            color: #8e8e93;
        }

        .record-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .edit-btn {
            background: rgba(10, 132, 255, 0.1);
            color: #0a84ff;
        }

        .delete-btn {
            background: rgba(255, 69, 58, 0.1);
            color: #ff453a;
        }

        .edit-btn:active, .delete-btn:active {
            transform: scale(0.95);
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #8e8e93;
        }

        .search-box input {
            padding-left: 48px;
        }

        .search-box input::placeholder {
            color: #3a3a40;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 999;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .overlay.active {
            display: block;
            opacity: 1;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            max-width: 350px;
            margin: 0 auto;
            background: #2c2c2e;
            color: white;
            padding: 16px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 2000;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast i {
            font-size: 24px;
            color: #32d74b;
        }

        @media (max-width: 380px) {
            .record-details {
                grid-template-columns: 1fr;
            }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
        }

        .empty-state i {
            font-size: 48px;
            color: #8e8e93;
            margin-bottom: 16px;
        }

        .empty-state p {
            color: #8e8e93;
        }

        .sync-notification {
            background: rgba(50, 215, 75, 0.1);
            border: 1px solid rgba(50, 215, 75, 0.3);
            border-radius: 30px;
            padding: 6px 12px;
            font-size: 12px;
            color: #32d74b;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-left: 10px;
        }

        .sync-notification i {
            font-size: 12px;
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="logo">
        <i class="fas fa-tools"></i>
        <h1>PRO-FIX BULUT</h1>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
        <!-- Bulut Durumu -->
        <div class="cloud-status" id="cloudStatus">
            <i class="fas fa-cloud-upload-alt"></i>
            <span id="statusText">Bağlanıyor...</span>
        </div>
        <div class="menu-btn" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </div>
    </div>
</div>

<!-- Ana İçerik -->
<div class="container">
    <!-- İstatistik Kartları -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="totalCount">0</div>
            <div class="stat-label">Toplam Tamir</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="todayCount">0</div>
            <div class="stat-label">Bugün</div>
        </div>
    </div>

    <!-- Kayıt Formu -->
    <div class="card">
        <div class="section-title">
            <i class="fas fa-plus-circle"></i>
            <span>YENİ KAYIT / DÜZENLE</span>
            <span class="sync-notification" id="syncBadge" style="display: none;">
                <i class="fas fa-sync-alt fa-spin"></i> Senkronize
            </span>
        </div>

        <div class="input-group">
            <label><i class="fas fa-mobile-alt" style="margin-right: 6px;"></i> Model / Cihaz</label>
            <input type="text" id="device" placeholder="Cihaz modeli giriniz" autocomplete="off">
        </div>

        <div class="input-group">
            <label><i class="fas fa-qrcode"></i> Servis Kodu / Seri No</label>
            <input type="text" id="code" placeholder="Servis kodu giriniz" autocomplete="off">
        </div>

        <div class="input-group">
            <label><i class="fas fa-user-cog"></i> Usta</label>
            <select id="usta">
                <option value="" disabled selected>Usta seçiniz</option>
                <option value="Kadir">Kadir Usta</option>
                <option value="Mehmet">Mehmet Usta</option>
            </select>
        </div>

        <div class="input-group">
            <label><i class="fas fa-wrench"></i> İşlem</label>
            <select id="islem">
                <option value="" disabled selected>İşlem seçiniz</option>
                <option value="BGA Değişim">BGA Değişim</option>
                <option value="EMMC Değişim">EMMC Değişim</option>
            </select>
        </div>

        <div class="input-group">
            <label><i class="fas fa-sticky-note"></i> Notlar</label>
            <textarea id="notes" rows="2" placeholder="Not ekleyin (opsiyonel)"></textarea>
        </div>

        <button class="btn" onclick="saveData()">
            <i class="fas fa-cloud-upload-alt"></i>
            Buluta Kaydet
        </button>
        <button class="btn btn-secondary" onclick="clearForm()" style="margin-top: 0;">
            <i class="fas fa-undo-alt"></i>
            Temizle
        </button>
    </div>

    <!-- Grafik Kartı -->
    <div class="card">
        <div class="section-title">
            <i class="fas fa-chart-bar"></i>
            <span>USTA PERFORMANS</span>
        </div>
        <div class="chart-container">
            <canvas id="chart" style="width: 100%; height: 200px;"></canvas>
        </div>
    </div>

    <!-- BULUT BİLGİLENDİRME -->
    <div class="card" style="background: rgba(10, 132, 255, 0.05); border-color: rgba(10, 132, 255, 0.2);">
        <div style="display: flex; align-items: center; gap: 12px;">
            <i class="fas fa-cloud" style="font-size: 32px; color: #0a84ff;"></i>
            <div>
                <h3 style="margin-bottom: 5px;">📱 İKİ TELEFONDA ORTAK KAYIT</h3>
                <p style="color: #8e8e93; font-size: 13px;">
                    <i class="fas fa-check-circle" style="color: #32d74b;"></i> Sen kaydedince Kadir Usta görür!<br>
                    <i class="fas fa-check-circle" style="color: #32d74b;"></i> Kadir Usta kaydedince sen görürsün!<br>
                    <i class="fas fa-check-circle" style="color: #32d74b;"></i> Aynı bulut, aynı kayıtlar!
                </p>
            </div>
        </div>
    </div>
</div>

<!-- Sidebar (Kayıt Listesi) -->
<div id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <h3 style="font-size: 20px;">Kayıtlı Servisler</h3>
        <div class="close-btn" onclick="toggleSidebar()">
            <i class="fas fa-times"></i>
        </div>
    </div>

    <!-- Arama -->
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="search" placeholder="Ara: kod, cihaz, usta..." onkeyup="renderRecords()">
    </div>

    <!-- Filtreler -->
    <div style="display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding: 4px 0;">
        <button class="btn-secondary" style="padding: 8px 16px; font-size: 13px;" onclick="filterRecords('all')">Tümü</button>
        <button class="btn-secondary" style="padding: 8px 16px; font-size: 13px;" onclick="filterRecords('Kadir')">Kadir</button>
        <button class="btn-secondary" style="padding: 8px 16px; font-size: 13px;" onclick="filterRecords('Mehmet')">Mehmet</button>
    </div>

    <!-- Kayıt Listesi -->
    <div id="records" style="padding-bottom: 30px;"></div>
</div>

<!-- Overlay -->
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

<!-- Toast Bildirimi -->
<div id="toast" class="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastMessage">İşlem başarılı</span>
</div>

<script>
// ===========================================
// SENİN GERÇEK FIREBASE ANAHTARLARIN!
// ===========================================
const firebaseConfig = {
    apiKey: "AIzaSyBQSINTtuBwuzZrvrtGQSHSB7BYGDHglz8",
    authDomain: "emmc-84368.firebaseapp.com",
    databaseURL: "https://emmc-84368-default-rtdb.firebaseio.com",
    projectId: "emmc-84368",
    storageBucket: "emmc-84368.firebasestorage.app",
    messagingSenderId: "876650784012",
    appId: "1:876650784012:web:1bfd1e383f2ef4523fd529",
    measurementId: "G-3K1XS5WV2D"
};

// Firebase'i başlat
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// ===========================================
// VERİTABANI
// ===========================================
let db = [];
let editingId = null;
let chart = null;
let currentFilter = 'all';

// ===========================================
// BULUT SENKRONİZASYONU
// ===========================================

// Sayfa açılır açılmaz buluttan verileri al
window.onload = function() {
    // Önce localStorage'dan yükle (varsa)
    const localData = localStorage.getItem('profix_bulut');
    if (localData) {
        db = JSON.parse(localData);
    }
    
    // Buluttan verileri dinle - GERÇEK ZAMANLI!
    database.ref('servisKayitlari').on('value', (snapshot) => {
        const bulutVerisi = snapshot.val();
        
        if (bulutVerisi) {
            // Buluttaki verileri al
            db = bulutVerisi;
            
            // Kendi telefonuna da kaydet
            localStorage.setItem('profix_bulut', JSON.stringify(db));
            
            // Ekranı güncelle
            renderRecords();
            updateChart();
            updateStats();
            
            // Yeşil bildirim göster
            document.getElementById('statusText').innerHTML = 'Bağlandı';
            document.getElementById('cloudStatus').style.background = 'rgba(50, 215, 75, 0.1)';
            document.getElementById('cloudStatus').style.borderColor = 'rgba(50, 215, 75, 0.3)';
            document.querySelector('#cloudStatus i').style.color = '#32d74b';
            
            // Yeni kayıt geldi bildirimi
            showToast('📥 Buluttan yeni kayıtlar alındı!');
        }
        
        // Senkronizasyon rozetini göster
        document.getElementById('syncBadge').style.display = 'inline-flex';
        setTimeout(() => {
            document.getElementById('syncBadge').style.display = 'none';
        }, 2000);
    }, (error) => {
        // Hata olursa
        document.getElementById('statusText').innerHTML = 'Bağlantı yok';
        document.getElementById('cloudStatus').style.background = 'rgba(255, 69, 58, 0.1)';
        document.getElementById('cloudStatus').style.borderColor = 'rgba(255, 69, 58, 0.3)';
        document.querySelector('#cloudStatus i').style.color = '#ff453a';
    });
    
    // Render işlemleri
    renderRecords();
    updateChart();
    updateStats();
};

// Toast göster
function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');
    const icon = toast.querySelector('i');
    
    toastMessage.textContent = message;
    
    if (type === 'success') {
        icon.style.color = '#32d74b';
        icon.className = 'fas fa-check-circle';
    } else if (type === 'error') {
        icon.style.color = '#ff453a';
        icon.className = 'fas fa-exclamation-circle';
    } else if (type === 'cloud') {
        icon.style.color = '#0a84ff';
        icon.className = 'fas fa-cloud-upload-alt';
    }
    
    toast.classList.add('show');
    
    setTimeout(() => {
        toast.classList.remove('show');
    }, 3000);
}

// Sidebar toggle
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('active');
}

// Form temizle
function clearForm() {
    document.getElementById('device').value = '';
    document.getElementById('code').value = '';
    document.getElementById('usta').value = '';
    document.getElementById('islem').value = '';
    document.getElementById('notes').value = '';
    editingId = null;
    showToast('Form temizlendi');
}

// Filtreleme
function filterRecords(usta) {
    currentFilter = usta;
    renderRecords();
}

// İstatistikleri güncelle
function updateStats() {
    const total = db.length;
    const today = db.filter(r => {
        const todayDate = new Date().toLocaleDateString();
        return r.date && r.date.includes(todayDate);
    }).length;
    
    document.getElementById('totalCount').textContent = total;
    document.getElementById('todayCount').textContent = today;
}

// ===========================================
// KAYDETME - HEM BULUTA HEM TELEFONA
// ===========================================
function saveData() {
    let device = document.getElementById('device').value.trim();
    let code = document.getElementById('code').value.trim();
    let usta = document.getElementById('usta').value;
    let islem = document.getElementById('islem').value;
    let notes = document.getElementById('notes').value.trim();
    
    if (!device || !code || !usta || !islem) {
        showToast('Lütfen tüm zorunlu alanları doldurun!', 'error');
        return;
    }
    
    const now = new Date();
    const formattedDate = now.toLocaleDateString('tr-TR') + ' ' + now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    
    if (editingId) {
        let index = db.findIndex(r => r.id === editingId);
        if (index !== -1) {
            db[index] = {
                ...db[index],
                device,
                code,
                usta,
                islem,
                notes,
                date: formattedDate
            };
            showToast('Kayıt güncellendi');
        }
        editingId = null;
    } else {
        db.unshift({
            id: Date.now(),
            device,
            code,
            usta,
            islem,
            notes,
            date: formattedDate
        });
        showToast('Yeni kayıt eklendi');
    }
    
    // 1. KENDİ TELEFONUNA KAYDET (localStorage)
    localStorage.setItem('profix_bulut', JSON.stringify(db));
    
    // 2. BULUTA KAYDET (Kadir Usta'nın telefonu da görsün!)
    database.ref('servisKayitlari').set(db)
        .then(() => {
            showToast('☁️ Buluta kaydedildi! Kadir Usta görüyor!', 'cloud');
            
            // Senkronizasyon rozeti
            document.getElementById('syncBadge').style.display = 'inline-flex';
            setTimeout(() => {
                document.getElementById('syncBadge').style.display = 'none';
            }, 2000);
        })
        .catch((error) => {
            showToast('Bulut bağlantısı yok!', 'error');
        });
    
    // UI'ı güncelle
    renderRecords();
    updateChart();
    updateStats();
    clearForm();
    
    // Sidebar'ı kapat
    if (window.innerWidth < 768) {
        toggleSidebar();
    }
}

// Düzenle
function editRecord(id) {
    let rec = db.find(r => r.id === id);
    if (!rec) return;
    
    document.getElementById('device').value = rec.device;
    document.getElementById('code').value = rec.code;
    document.getElementById('usta').value = rec.usta;
    document.getElementById('islem').value = rec.islem;
    document.getElementById('notes').value = rec.notes || '';
    
    editingId = id;
    
    toggleSidebar();
    showToast('Düzenleme modu aktif');
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Sil
function deleteRecord(id) {
    if (confirm('Bu kaydı silmek istediğinize emin misiniz?')) {
        db = db.filter(r => r.id !== id);
        
        // Kendi telefonuna kaydet
        localStorage.setItem('profix_bulut', JSON.stringify(db));
        
        // Buluta kaydet (Kadir de görsün silindiğini!)
        database.ref('servisKayitlari').set(db);
        
        renderRecords();
        updateChart();
        updateStats();
        showToast('Kayıt silindi');
    }
}

// Kayıtları listele
function renderRecords() {
    let term = document.getElementById('search').value.toLowerCase();
    let container = document.getElementById('records');
    
    let filteredDb = db.filter(r => {
        const matchesSearch = r.device.toLowerCase().includes(term) || 
                              r.code.toLowerCase().includes(term) || 
                              r.usta.toLowerCase().includes(term) ||
                              (r.islem && r.islem.toLowerCase().includes(term));
        
        const matchesFilter = currentFilter === 'all' || r.usta === currentFilter;
        
        return matchesSearch && matchesFilter;
    });
    
    if (filteredDb.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <p>Kayıt bulunamadı</p>
            </div>
        `;
        return;
    }
    
    container.innerHTML = '';
    filteredDb.forEach(r => {
        let div = document.createElement('div');
        div.className = 'record-card';
        
        div.innerHTML = `
            <div class="record-header">
                <span class="record-code">${r.code}</span>
                <span class="record-badge">${r.islem}</span>
            </div>
            <div style="font-size: 16px; font-weight: 600; margin-bottom: 8px;">${r.device}</div>
            <div class="record-details">
                <div class="detail-item">
                    <i class="fas fa-user"></i>
                    <span>Usta</span>
                    <span style="font-weight: 600;">${r.usta}</span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-calendar"></i>
                    <span>Tarih</span>
                    <span style="font-weight: 600; font-size: 10px;">${r.date}</span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-sticky-note"></i>
                    <span>Not</span>
                    <span style="font-weight: 600;">${r.notes || '-'}</span>
                </div>
            </div>
            <div class="record-actions">
                <button class="action-btn edit-btn" onclick="editRecord(${r.id})">
                    <i class="fas fa-edit"></i> Düzenle
                </button>
                <button class="action-btn delete-btn" onclick="deleteRecord(${r.id})">
                    <i class="fas fa-trash"></i> Sil
                </button>
            </div>
        `;
        container.appendChild(div);
    });
}

// Grafik güncelle
function updateChart() {
    const ctx = document.getElementById('chart').getContext('2d');
    
    let ustaCounts = {
        'Kadir': 0,
        'Mehmet': 0
    };
    
    db.forEach(r => {
        if (ustaCounts.hasOwnProperty(r.usta)) {
            ustaCounts[r.usta]++;
        }
    });
    
    let labels = Object.keys(ustaCounts);
    let data = Object.values(ustaCounts);
    
    if (chart) chart.destroy();
    
    chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels,
            datasets: [{
                label: 'Tamir Sayısı',
                data,
                backgroundColor: [
                    'rgba(10, 132, 255, 0.8)',
                    'rgba(50, 215, 75, 0.8)'
                ],
                borderRadius: 8,
                barPercentage: 0.6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    grid: { color: 'rgba(255,255,255,0.05)' },
                    ticks: { color: '#8e8e93' }
                },
                x: {
                    grid: { display: false },
                    ticks: { color: '#8e8e93' }
                }
            }
        }
    });
}

// Klavye kısayolu
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        const sidebar = document.getElementById('sidebar');
        if (sidebar.classList.contains('open')) {
            toggleSidebar();
        }
    }
});

// Enter tuşu desteği
document.addEventListener('DOMContentLoaded', function() {
    const inputs = document.querySelectorAll('input, select');
    inputs.forEach(input => {
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                saveData();
            }
        });
    });
});
</script>
