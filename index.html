<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PRO-FIX iOS Panel</title>
<style>
body{margin:0;font-family:-apple-system, sans-serif;background:#000;color:white;padding:20px;}
input,textarea{width:100%;padding:12px;margin:6px 0;background:#1c1c1e;border:1px solid #333;border-radius:10px;color:white;}
button,.opt-btn{width:100%;padding:14px;margin:6px 0;border-radius:10px;text-align:center;font-weight:bold;background:#0a84ff;color:white;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.opt-btn.active{background:#32d74b;}
#records{margin-top:20px;}
.record{background:#1c1c1e;padding:10px;border-radius:8px;margin-bottom:8px;}
</style>
</head>
<body>

<h2>PRO-FIX iOS</h2>

<input id="code" placeholder="Servis Kodu">
<input id="device" placeholder="Cihaz">

<h4>Usta Seç</h4>
<div class="opt-btn" id="kadir" ontouchstart="ustaSec('Kadir',this)">Kadir</div>
<div class="opt-btn" id="mehmet" ontouchstart="ustaSec('Mehmet',this)">Mehmet</div>

<h4>İşlem Seç</h4>
<div class="opt-btn" id="emmc" ontouchstart="islemSec('EMMC',this)">EMMC</div>
<div class="opt-btn" id="anakart" ontouchstart="islemSec('Anakart',this)">Anakart</div>
<div class="opt-btn" id="diger" ontouchstart="islemSec('DİĞER',this)">DİĞER</div>

<textarea id="manual" placeholder="Manuel işlem (DİĞER seçilmişse)"></textarea>

<button ontouchstart="kaydet()">Kaydet</button>

<h3>Kayıtlar</h3>
<div id="records"></div>

<script>
let db=JSON.parse(localStorage.getItem('profix_db'))||[];
let usta='',islem='';

function ustaSec(name,el){
usta=name;
document.querySelectorAll('.opt-btn').forEach(x=>x.classList.remove('active'));
el.classList.add('active');
}

function islemSec(name,el){
islem=name;
document.querySelectorAll('.opt-btn').forEach(x=>x.classList.remove('active'));
el.classList.add('active');
}

function kaydet(){
let code=document.getElementById('code').value;
let device=document.getElementById('device').value;
let manual=document.getElementById('manual').value;
let final=islem==='DİĞER'?manual:islem;

if(!code||!device||!usta||!final){alert('Eksik bilgi!');return;}

db.unshift({id:Date.now(),code,device,usta,islem:final,date:new Date().toLocaleString()});
localStorage.setItem('profix_db',JSON.stringify(db));
render();
alert('Kaydedildi!');
document.getElementById('code').value='';document.getElementById('device').value='';document.getElementById('manual').value='';usta='';islem='';document.querySelectorAll('.opt-btn').forEach(x=>x.classList.remove('active'));
}

function render(){
let list=document.getElementById('records');
list.innerHTML='';
db.forEach(x=>{
let div=document.createElement('div');
div.className='record';
div.innerHTML=`<b>${x.code}</b> - ${x.device}<br>${x.usta} | ${x.islem}<br>${x.date}`;
list.appendChild(div);
});
}

render();
</script>

</body>
</html>
