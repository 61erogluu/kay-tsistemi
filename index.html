<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PROFIX Cloud</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>

<style>

:root{
--bg:#000;
--card:#1c1c1e;
--border:#3a3a3c;
--blue:#0a84ff;
--green:#30d158;
}

body{
margin:0;
font-family:-apple-system;
background:var(--bg);
color:white;
}

.header{
padding:50px 20px 20px;
background:var(--card);
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
padding:20px;
}

.input{
width:100%;
padding:16px;
border-radius:12px;
border:2px solid var(--border);
background:var(--card);
color:white;
margin-bottom:12px;
font-size:16px;
}

.btn{
padding:18px;
border-radius:12px;
border:2px solid var(--border);
background:var(--card);
text-align:center;
font-weight:700;
margin-bottom:10px;
}

.active{
border-color:var(--blue);
background:rgba(10,132,255,.2);
}

.save{
background:var(--blue);
border:none;
width:100%;
padding:20px;
border-radius:14px;
font-weight:800;
}

.stats{
background:var(--card);
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

.sidebar{
position:fixed;
right:-100%;
top:0;
width:100%;
height:100%;
background:#000;
padding:60px 20px;
transition:.3s;
overflow:auto;
}

.sidebar.open{
right:0;
}

.record{
background:var(--card);
padding:15px;
border-radius:12px;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="header">
<h2>PRO-FIX CLOUD</h2>
<div onclick="toggleMenu()">☰</div>
</div>

<div class="container">

<div class="stats">
<b>Bugünkü Tamir:</b>
<span id="today">0</span>
</div>

<input id="code" class="input" placeholder="Servis kodu">

<input id="device" class="input" placeholder="Cihaz">

<div class="btn" onclick="selectUsta('Kadir',this)">KADİR</div>
<div class="btn" onclick="selectUsta('Mehmet',this)">MEHMET</div>

<div class="btn" onclick="selectProc('EMMC',this)">EMMC</div>
<div class="btn" onclick="selectProc('Anakart',this)">ANAKART</div>

<textarea id="manual" class="input" placeholder="Diğer işlem"></textarea>

<button class="save" onclick="save()">KAYDET</button>

</div>

<div class="sidebar" id="sidebar">

<h2>Kayıtlar</h2>

<div id="list"></div>

</div>

<script>

/* FIREBASE AYARI */

const firebaseConfig = {

apiKey: "BURAYA_API_KEY",

authDomain: "app.firebaseapp.com",

databaseURL: "BURAYA_DATABASE_URL",

projectId: "app",

storageBucket: "app.appspot.com",

messagingSenderId: "123",

appId: "123"

};

const app = firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let selectedUsta="";
let selectedProc="";

function toggleMenu(){

document.getElementById("sidebar").classList.toggle("open");

}

/* SEÇİM */

function selectUsta(u,el){

selectedUsta=u;

document.querySelectorAll(".btn").forEach(b=>b.classList.remove("active"));

el.classList.add("active");

}

function selectProc(p,el){

selectedProc=p;

el.classList.add("active");

}

/* SAVE */

function save(){

let code=document.getElementById("code").value;

let device=document.getElementById("device").value;

let manual=document.getElementById("manual").value;

let proc=selectedProc || manual;

let data={

code:code,

device:device,

proc:proc,

usta:selectedUsta,

date:new Date().toLocaleString("tr-TR")

};

firebase.database().ref("records").push(data);

alert("Buluta kaydedildi");

}

/* LOAD */

firebase.database().ref("records").on("value",snap=>{

let list=document.getElementById("list");

list.innerHTML="";

let today=0;

let todayDate=new Date().toLocaleDateString("tr-TR");

snap.forEach(child=>{

let item=child.val();

if(item.date.includes(todayDate)) today++;

let div=document.createElement("div");

div.className="record";

div.innerHTML=`

<b>${item.code}</b><br>

${item.device}<br>

${item.proc}<br>

${item.usta}<br>

${item.date}

`;

list.appendChild(div);

});

document.getElementById("today").innerText=today;

});

</script>

</body>
</html>
