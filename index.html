<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>FULL YAZILIM | KATEGORİLİ PANEL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #f5faff;
            min-height: 100vh;
        }

        /* Ana uygulama */
        .app {
            display: flex;
            min-height: 100vh;
        }

        /* SOL MENÜ - KATEGORİLER (3 çizgili) */
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border-right: 1px solid rgba(180, 212, 240, 0.5);
            padding: 25px 0;
            transition: all 0.3s;
            position: relative;
            box-shadow: 10px 0 30px -15px rgba(120, 170, 210, 0.2);
        }

        .sidebar.collapsed {
            width: 80px;
        }

        .menu-toggle {
            position: absolute;
            right: -15px;
            top: 30px;
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 1px solid #d0e5ff;
            z-index: 10;
        }

        .menu-toggle span {
            font-size: 20px;
            color: #2b5a7a;
        }

        .sidebar-header {
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid #d4e5fa;
        }

        .logo-mini {
            font-size: 24px;
            font-weight: 700;
            color: #1a4c72;
            white-space: nowrap;
        }

        .kategori-title {
            padding: 20px 20px 10px 20px;
            font-weight: 600;
            color: #3f6f95;
            letter-spacing: 1px;
        }

        .kategori-list {
            list-style: none;
        }

        .kategori-item {
            padding: 12px 25px;
            margin: 4px 10px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            color: #1f4a6e;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .kategori-item:hover {
            background: rgba(160, 200, 240, 0.3);
        }

        .kategori-item.active {
            background: #b0d4f5;
            color: #0a3147;
            font-weight: 600;
        }

        .kategori-item .emoji {
            font-size: 20px;
        }

        .sidebar.collapsed .kategori-item span:not(.emoji) {
            display: none;
        }

        .sidebar.collapsed .kategori-title {
            display: none;
        }

        /* SAĞ ANA İÇERİK */
        .main-content {
            flex: 1;
            padding: 25px 35px;
            overflow-y: auto;
        }

        /* Header - Arama ve kontroller */
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 60px;
            padding: 5px 5px 5px 25px;
            box-shadow: 0 5px 15px rgba(151, 194, 231, 0.2);
            border: 1px solid #e2efff;
            flex: 1;
            max-width: 500px;
        }

        .search-box input {
            flex: 1;
            border: none;
            padding: 15px 0;
            font-size: 16px;
            outline: none;
            background: transparent;
        }

        .search-box button {
            background: #b8d7fa;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            color: #113853;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-box button:hover {
            background: #9ec0e8;
        }

        .giris-buttons {
            display: flex;
            gap: 12px;
        }

        .giris-btn {
            padding: 12px 28px;
            border-radius: 40px;
            border: 1px solid #d2e5ff;
            background: white;
            font-weight: 600;
            color: #235577;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .giris-btn.admin {
            background: #1f4a6e;
            color: white;
            border: none;
        }

        /* Ürün grid - 9'lu ekleme için */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: white;
            border-radius: 32px;
            padding: 22px;
            box-shadow: 0 12px 30px -12px rgba(120, 170, 210, 0.2);
            border: 1px solid rgba(255,255,255,0.8);
            transition: 0.25s ease;
            position: relative;
            backdrop-filter: blur(5px);
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 25px 35px -15px #8bb4da;
        }

        .product-badge {
            position: absolute;
            top: 15px;
            right: 20px;
            background: #f0f7ff;
            padding: 5px 15px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            color: #1f4a6e;
        }

        .product-title {
            font-size: 20px;
            font-weight: 600;
            color: #0a3147;
            margin: 15px 0 8px 0;
        }

        .product-category {
            color: #5b84a5;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .product-price {
            font-size: 28px;
            font-weight: 700;
            color: #0f3f5c;
            margin: 15px 0;
        }

        .product-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .edit-btn, .delete-btn {
            flex: 1;
            padding: 12px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .edit-btn {
            background: #e4f0fe;
            color: #1f4a6e;
        }

        .delete-btn {
            background: #ffe5e5;
            color: #a13b3b;
        }

        /* Ekleme butonları 2-3-4-5-6-7-8-9 */
        .add-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 30px 0 20px 0;
            padding: 15px 0;
            border-top: 2px dashed #c5dfff;
            border-bottom: 2px dashed #c5dfff;
        }

        .add-number-btn {
            width: 60px;
            height: 60px;
            border-radius: 30px;
            background: white;
            border: 2px solid #b0d2f2;
            font-size: 24px;
            font-weight: 700;
            color: #1f4a6e;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .add-number-btn:hover {
            background: #b0d2f2;
            transform: scale(1.1);
            color: white;
        }

        /* Manuel ekleme formu */
        .manual-form {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 25px;
            margin: 25px 0;
            border: 1px solid white;
        }

        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .form-input {
            flex: 1;
            padding: 16px 22px;
            border-radius: 50px;
            border: 1px solid #d9eaff;
            background: white;
            font-size: 15px;
            outline: none;
            min-width: 150px;
        }

        .form-input:focus {
            border-color: #7bb2e6;
            box-shadow: 0 0 0 3px rgba(123, 178, 230, 0.2);
        }

        .submit-btn {
            padding: 16px 40px;
            background: #1f4a6e;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Admin/Müşteri Panelleri */
        .admin-panel, .customer-panel {
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 700px) {
            .app { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #d4e5fa; }
            .product-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- SOL MENÜ - KATEGORİLER (3 çizgi ile açılır/kapanır) -->
    <div class="sidebar" id="sidebar">
        <div class="menu-toggle" onclick="toggleSidebar()">
            <span>☰</span>
        </div>
        <div class="sidebar-header">
            <div class="logo-mini">FULL</div>
        </div>
        <div class="kategori-title">KATEGORİLER</div>
        <ul class="kategori-list" id="kategoriListesi">
            <li class="kategori-item active" data-kategori="tum">
                <span class="emoji">📋</span> <span>Tümü</span>
            </li>
            <li class="kategori-item" data-kategori="Finans">
                <span class="emoji">💰</span> <span>Finans</span>
            </li>
            <li class="kategori-item" data-kategori="Perakende">
                <span class="emoji">🏪</span> <span>Perakende</span>
            </li>
            <li class="kategori-item" data-kategori="E-ticaret">
                <span class="emoji">🛒</span> <span>E-ticaret</span>
            </li>
            <li class="kategori-item" data-kategori="CRM">
                <span class="emoji">👥</span> <span>CRM</span>
            </li>
            <li class="kategori-item" data-kategori="Sağlık">
                <span class="emoji">⚕️</span> <span>Sağlık</span>
            </li>
            <li class="kategori-item" data-kategori="Eğitim">
                <span class="emoji">📚</span> <span>Eğitim</span>
            </li>
            <li class="kategori-item" data-kategori="Üretim">
                <span class="emoji">🏭</span> <span>Üretim</span>
            </li>
            <li class="kategori-item" data-kategori="Lojistik">
                <span class="emoji">🚚</span> <span>Lojistik</span>
            </li>
        </ul>
    </div>

    <!-- SAĞ ANA İÇERİK -->
    <div class="main-content">
        <!-- Header: Arama + Giriş Butonları -->
        <div class="content-header">
            <div class="search-box">
                <input type="text" id="aramaInput" placeholder="Yazılım ara... (örn: Muhasebe)" value="">
                <button onclick="urunAra()">🔍 Ara</button>
            </div>
            <div class="giris-buttons">
                <button class="giris-btn" onclick="misafirPanel()">👤 Misafir</button>
                <button class="giris-btn admin" onclick="adminGiris()">🔐 Yönetici</button>
            </div>
        </div>

        <!-- DİNAMİK İÇERİK ALANI -->
        <div id="dynamicContent">
            <!-- Varsayılan olarak ürünler listelenecek -->
        </div>
    </div>
</div>

<script>
// ========== GLOBAL VERİLER ==========
let yazilimlar = [
    { id: 1, ad: "Premium Muhasebe", fiyat: 12500, kategori: "Finans", aciklama: "Profesyonel muhasebe", stok: 99 },
    { id: 2, ad: "Fast POS", fiyat: 8400, kategori: "Perakende", aciklama: "Hızlı satış sistemi", stok: 50 },
    { id: 3, ad: "E-Ticaret Pro", fiyat: 19900, kategori: "E-ticaret", aciklama: "Entegre e-ticaret", stok: 30 },
    { id: 4, ad: "Müşteri CRM", fiyat: 6700, kategori: "CRM", aciklama: "Müşteri takip", stok: 200 },
    { id: 5, ad: "Doktor Randevu", fiyat: 15300, kategori: "Sağlık", aciklama: "Online randevu", stok: 15 },
    { id: 6, ad: "Öğrenci Bilgi Sistemi", fiyat: 22000, kategori: "Eğitim", aciklama: "Okul yönetimi", stok: 8 },
    { id: 7, ad: "Stok Takip", fiyat: 9300, kategori: "Perakende", aciklama: "Depo yönetimi", stok: 45 },
    { id: 8, ad: "Fatura Asistanı", fiyat: 5200, kategori: "Finans", aciklama: "e-fatura entegre", stok: 120 },
    { id: 9, ad: "Kargo Takip", fiyat: 7800, kategori: "Lojistik", aciklama: "Kargo yönetimi", stok: 34 }
];

let musteriler = [];
let aktifKategori = "tum";
let aramaKelimesi = "";

// ADMIN SİFRE (GİZLİ)
const ADMIN_SIFRE = "6161";

// ========== SİDEBAR ==========
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('collapsed');
}

// ========== KATEGORİ FİLTRESİ ==========
function kategoriAktif(kategori) {
    aktifKategori = kategori;
    
    // Aktif class güncelle
    document.querySelectorAll('.kategori-item').forEach(item => {
        item.classList.remove('active');
        if(item.dataset.kategori === kategori) {
            item.classList.add('active');
        }
    });
    
    urunleriGoster();
}

// ========== ARAMA ==========
function urunAra() {
    aramaKelimesi = document.getElementById('aramaInput').value.toLowerCase().trim();
    urunleriGoster();
}

// ========== ÜRÜNLERİ GÖSTER (GRID) ==========
function urunleriGoster() {
    let filtreli = yazilimlar;
    
    // Kategori filtre
    if (aktifKategori !== "tum") {
        filtreli = filtreli.filter(u => u.kategori === aktifKategori);
    }
    
    // Arama filtre
    if (aramaKelimesi !== "") {
        filtreli = filtreli.filter(u => 
            u.ad.toLowerCase().includes(aramaKelimesi) || 
            u.aciklama.toLowerCase().includes(aramaKelimesi) ||
            u.kategori.toLowerCase().includes(aramaKelimesi)
        );
    }
    
    // HTML oluştur
    let html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 style="color:#1a4a6e;">📦 Yazılımlar (${filtreli.length})</h2>
        </div>
    `;
    
    if (filtreli.length === 0) {
        html += `<div style="text-align:center; padding:60px; background:white; border-radius:40px;">🔍 Sonuç bulunamadı</div>`;
    } else {
        html += `<div class="product-grid">`;
        filtreli.forEach(u => {
            html += `
                <div class="product-card">
                    <div class="product-badge">${u.kategori}</div>
                    <div class="product-title">${u.ad}</div>
                    <div class="product-category">${u.aciklama}</div>
                    <div class="product-price">${u.fiyat.toLocaleString()} ₺</div>
                    <div style="font-size:14px; color:#3f6f95;">Stok: ${u.stok} adet</div>
                    <div class="product-actions">
                        <button class="edit-btn" onclick="duzenleFormuAc(${u.id})">✏️ Düzenle</button>
                        <button class="delete-btn" onclick="urunSil(${u.id})">🗑️ Sil</button>
                    </div>
                </div>
            `;
        });
        html += `</div>`;
    }
    
    document.getElementById('dynamicContent').innerHTML = html;
}

// ========== YÖNETİCİ GİRİŞİ ==========
function adminGiris() {
    let sifre = prompt("Yönetici şifresi:");
    if (sifre === ADMIN_SIFRE) {
        adminPanelGoster();
    } else {
        alert("❌ Yanlış şifre!");
    }
}

// ========== YÖNETİCİ PANELİ (2-3-4-5-6-7-8-9 EKLEME BUTONLARI) ==========
function adminPanelGoster() {
    let html = `
        <div class="admin-panel">
            <div style="background:#e1f0fe; border-radius:40px; padding:20px; margin-bottom:25px;">
                <h3 style="color:#0f3f5c;">🔐 Yönetici Paneli - Şifre: Gizli</h3>
            </div>
            
            <!-- 2'den 9'a kadar butonlar -->
            <div class="add-buttons">
                ${[2,3,4,5,6,7,8,9].map(sayi => `
                    <button class="add-number-btn" onclick="hizliEkle(${sayi})">+${sayi}</button>
                `).join('')}
            </div>
            
            <!-- Manuel ekleme formu (ben fiyatı manuel giricem) -->
            <div class="manual-form">
                <h4 style="margin-bottom:20px;">➕ Manuel Yazılım Ekle (Fiyatı sen gir)</h4>
                <div class="form-row">
                    <input type="text" id="manuelAd" class="form-input" placeholder="Yazılım adı">
                    <input type="number" id="manuelFiyat" class="form-input" placeholder="Fiyat (₺)">
                    <select id="manuelKategori" class="form-input">
                        <option value="Finans">Finans</option>
                        <option value="Perakende">Perakende</option>
                        <option value="E-ticaret">E-ticaret</option>
                        <option value="CRM">CRM</option>
                        <option value="Sağlık">Sağlık</option>
                        <option value="Eğitim">Eğitim</option>
                        <option value="Üretim">Üretim</option>
                        <option value="Lojistik">Lojistik</option>
                    </select>
                </div>
                <div class="form-row" style="margin-top:15px;">
                    <input type="text" id="manuelAciklama" class="form-input" placeholder="Açıklama">
                    <input type="number" id="manuelStok" class="form-input" placeholder="Stok adedi" value="10">
                    <button class="submit-btn" onclick="manuelEkle()">YAZILIM EKLE</button>
                </div>
            </div>
            
            <!-- Müşteri Listesi -->
            <div style="background:white; border-radius:40px; padding:25px; margin-top:25px;">
                <h4>👥 Kayıtlı Müşteriler</h4>
                <table style="width:100%; margin-top:15px;">
                    <tr><th>E-posta</th><th>Şifre</th><th>Tarih</th></tr>
                    ${musteriler.map(m => `<tr><td>${m.email}</td><td>${m.sifre}</td><td>${m.tarih || ''}</td></tr>`).join('')}
                    ${musteriler.length === 0 ? '<tr><td colspan="3" style="text-align:center;">Henüz müşteri yok</td></tr>' : ''}
                </table>
            </div>
        </div>
    `;
    
    document.getElementById('dynamicContent').innerHTML = html;
}

// ========== HIZLI EKLE (2'den 9'a kadar) ==========
function hizliEkle(adet) {
    for(let i = 0; i < adet; i++) {
        let yeniId = yazilimlar.length + 1;
        yazilimlar.push({
            id: yeniId,
            ad: `Yeni Yazılım ${yeniId}`,
            fiyat: 10000 + (i * 500), // örnek fiyat, istersen değiştir
            kategori: "Genel",
            aciklama: "Otomatik eklenen ürün",
            stok: 50
        });
    }
    urunleriGoster();
    alert(`${adet} adet yazılım eklendi! Fiyatları düzenleyebilirsin.`);
}

// ========== MANUEL EKLE (ben fiyatı giriyorum) ==========
function manuelEkle() {
    let ad = document.getElementById('manuelAd')?.value.trim();
    let fiyat = parseFloat(document.getElementById('manuelFiyat')?.value);
    let kategori = document.getElementById('manuelKategori')?.value;
    let aciklama = document.getElementById('manuelAciklama')?.value.trim() || "Açıklama yok";
    let stok = parseInt(document.getElementById('manuelStok')?.value) || 10;
    
    if (!ad || isNaN(fiyat)) {
        alert("Ürün adı ve fiyatı girmelisin!");
        return;
    }
    
    yazilimlar.push({
        id: yazilimlar.length + 1,
        ad: ad,
        fiyat: fiyat,
        kategori: kategori,
        aciklama: aciklama,
        stok: stok
    });
    
    // Formu temizle
    document.getElementById('manuelAd').value = '';
    document.getElementById('manuelFiyat').value = '';
    document.getElementById('manuelAciklama').value = '';
    
    urunleriGoster();
    alert("✅ Yazılım eklendi!");
}

// ========== DÜZENLE / SİL ==========
function duzenleFormuAc(id) {
    let urun = yazilimlar.find(u => u.id === id);
    if (!urun) return;
    
    let yeniFiyat = prompt(`${urun.ad} için yeni fiyat girin:`, urun.fiyat);
    if (yeniFiyat !== null && !isNaN(yeniFiyat)) {
        urun.fiyat = parseFloat(yeniFiyat);
        urunlariGoster();
    }
}

function urunSil(id) {
    if (confirm("Bu yazılımı silmek istediğine emin misin?")) {
        yazilimlar = yazilimlar.filter(u => u.id !== id);
        urunleriGoster();
    }
}

// ========== MİSAFİR PANELİ (Hesap açma) ==========
function misafirPanel() {
    let html = `
        <div style="max-width:500px; margin:40px auto;">
            <div style="background:white; border-radius:60px; padding:50px; box-shadow:0 20px 40px -15px #aac2dc;">
                <h2 style="font-size:32px; margin-bottom:20px;">👤 Misafir Girişi</h2>
                <p style="margin-bottom:30px;">Hesap oluştur veya giriş yap</p>
                
                <input type="email" id="misafirEmail" placeholder="E-posta" style="width:100%; padding:18px; border-radius:40px; border:1px solid #d0e5ff; margin-bottom:15px;">
                <input type="password" id="misafirSifre" placeholder="Şifre" style="width:100%; padding:18px; border-radius:40px; border:1px solid #d0e5ff; margin-bottom:25px;">
                
                <button onclick="misafirKayit()" style="width:100%; padding:18px; background:#1f4a6e; color:white; border:none; border-radius:40px; font-size:18px; font-weight:600; cursor:pointer;">
                    Hesap Aç
                </button>
            </div>
        </div>
    `;
    
    document.getElementById('dynamicContent').innerHTML = html;
}

function misafirKayit() {
    let email = document.getElementById('misafirEmail')?.value.trim();
    let sifre = document.getElementById('misafirSifre')?.value.trim();
    
    if (!email || !sifre) {
        alert("E-posta ve şifre gerekli!");
        return;
    }
    
    musteriler.push({
        email: email,
        sifre: sifre,
        tarih: new Date().toLocaleString()
    });
    
    alert("✅ Hesabınız oluşturuldu! Yönetici panelinde görünecektir.");
    urunleriGoster(); // Ürünlere geri dön
}
