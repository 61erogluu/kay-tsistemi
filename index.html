<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRO-FIX | Profesyonel Panel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
        
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: #0d0d0f;
            color: white;
        }
        
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: #161616;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        
        header h2 {
            margin: 0;
            color: #0a84ff;
            font-size: 18px;
        }
        
        .menu-btn {
            font-size: 24px;
            cursor: pointer;
        }
        
        main {
            padding: 15px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #1c1c1f;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }
        
        button {
            width: 100%;
            padding: 14px;
            margin: 6px 0;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            background: #0a84ff;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        
        .section {
            margin-top: 15px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #ccc;
        }
        
        #sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 90%;
            max-width: 400px;
            height: 100%;
            background: #161616;
            z-index: 1000;
            transition: 0.3s;
            overflow-y: auto;
            padding: 15px;
        }
        
        #sidebar.open {
            right: 0;
        }
        
        .record {
            background: #1c1c1f;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        
        .record b {
            color: #0a84ff;
        }
        
        .record .actions {
            margin-top: 5px;
            text-align: right;
        }
        
        .record .actions span {
            cursor: pointer;
            margin-left: 10px;
            color: #ff6b6b;
            font-weight: bold;
        }
        
        .stats {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        
        .stat-box {
            flex: 1;
            background: #1c1c1f;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #0a84ff;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #1c1c1f;
            border-radius: 30px;
            margin: 10px 0;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 12px;
            background: #ff3b30;
        }
        
        .status-dot.online {
            background: #32d74b;
        }
    </style>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database.js"></script>
</head>
<body>

<header>
    <h2>PRO-FIX</h2>
    <div class="menu-btn" onclick="toggleSidebar()">☰</div>
</header>

<main>
    <!-- Durum -->
    <div class="status" id="status">
        <div class="status-dot" id="statusDot"></div>
        <div id="statusText">Buluta bağlanıyor...</div>
    </div>
    
    <!-- İstatistikler -->
    <div class="stats">
        <div class="stat-box">
            <div class="stat-value" id="totalCount">0</div>
            <div>Toplam</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="todayCount">0</div>
            <div>Bugün</div>
        </div>
    </div>
    
    <div class="section">Model / Cihaz</div>
    <input id="device" placeholder="Örn: Samsung S23">
    
    <div class="section">Servis Kodu</div>
    <input id="code" placeholder="Örn: SRV-001">
    
    <div class="section">Usta</div>
    <select id="usta">
        <option value="">Seçiniz</option>
        <option value="Kadir">Kadir</option>
        <option value="Mehmet">Mehmet</option>
    </select>
    
    <div class="section">İşlem</div>
    <select id="islem">
        <option value="">Seçiniz</option>
        <option value="BGA Değişim">BGA Değişim</option>
        <option value="EMMC Değişim">EMMC Değişim</option>
    </select>
    
    <div class="section">Notlar</div>
    <textarea id="notes" rows="2" placeholder="Not ekleyin..."></textarea>
    
    <button onclick="saveData()">Buluta Kaydet</button>
</main>

<div id="sidebar">
    <h3>Kayıtlı Servisler</h3>
    <input type="text" id="search" placeholder="Ara..." onkeyup="renderRecords()">
    <div style="display: flex; gap: 5px; margin: 10px 0;">
        <button onclick="filterRecords('all')" style="padding: 8px;">Tümü</button>
        <button onclick="filterRecords('Kadir')" style="padding: 8px;">Kadir</button>
        <button onclick="filterRecords('Mehmet')" style="padding: 8px;">Mehmet</button>
    </div>
    <div id="records"></div>
</div>

<script>
// ===========================================
// FIREBASE - SENİN GERÇEK ANAHTARLARIN
// ===========================================
const firebaseConfig = {
    apiKey: "AIzaSyBQSINTtuBwuzZrvrtGQSHSB7BYGDHglz8",
    authDomain: "emmc-84368.firebaseapp.com",
    databaseURL: "https://emmc-84368-default-rtdb.firebaseio.com",
    projectId: "emmc-84368",
    storageBucket: "emmc-84368.firebasestorage.app",
    messagingSenderId: "876650784012",
    appId: "1:876650784012:web:1bfd1e383f2ef4523fd529"
};

// Firebase başlat
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// ===========================================
// DEĞİŞKENLER
// ===========================================
let db = [];
let editingId = null;
let currentFilter = 'all';

// ===========================================
// BAĞLANTI KONTROLÜ - YEŞİL YANACAK!
// ===========================================
database.ref('.info/connected').on('value', (snap) => {
    if (snap.val() === true) {
        // Yeşil yap
        document.getElementById('statusDot').className = 'status-dot online';
        document.getElementById('statusText').innerHTML = '✅ Buluta bağlandı!';
        
        // Verileri yükle
        loadData();
    } else {
        // Kırmızı yap
        document.getElementById('statusDot').className = 'status-dot';
        document.getElementById('statusText').innerHTML = '❌ Bağlantı yok';
    }
});

// ===========================================
// VERİLERİ YÜKLE
// ===========================================
function loadData() {
    database.ref('kayitlar').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            db = Object.values(data);
        } else {
            db = [];
        }
        renderRecords();
        updateStats();
    });
}

// ===========================================
// KAYDET - KESİN ÇALIŞACAK!
// ===========================================
function saveData() {
    let device = document.getElementById('device').value.trim();
    let code = document.getElementById('code').value.trim();
    let usta = document.getElementById('usta').value;
    let islem = document.getElementById('islem').value;
    let notes = document.getElementById('notes').value.trim();
    
    if (!device || !code || !usta || !islem) {
        alert('Tüm alanları doldurun!');
        return;
    }
    
    let now = new Date();
    let date = now.toLocaleDateString('tr-TR') + ' ' + 
               now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    
    let record = {
        id: Date.now(),
        device: device,
        code: code,
        usta: usta,
        islem: islem,
        notes: notes,
        date: date
    };
    
    // Firebase'e kaydet
    database.ref('kayitlar/' + record.id).set(record)
        .then(() => {
            alert('☁️ Buluta kaydedildi!');
            document.getElementById('device').value = '';
            document.getElementById('code').value = '';
            document.getElementById('usta').value = '';
            document.getElementById('islem').value = '';
            document.getElementById('notes').value = '';
        })
        .catch((error) => {
            alert('Hata: ' + error.message);
        });
}

// ===========================================
// DİĞER FONKSİYONLAR
// ===========================================
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}

function filterRecords(usta) {
    currentFilter = usta;
    renderRecords();
}

function updateStats() {
    document.getElementById('totalCount').innerText = db.length;
    
    let today = new Date().toLocaleDateString();
    let todayCount = db.filter(r => r.date && r.date.includes(today)).length;
    document.getElementById('todayCount').innerText = todayCount;
}

function renderRecords() {
    let term = document.getElementById('search').value.toLowerCase();
    let container = document.getElementById('records');
    
    let filtered = db.filter(r => {
        let matchesSearch = r.device.toLowerCase().includes(term) || 
                           r.code.toLowerCase().includes(term) || 
                           r.usta.toLowerCase().includes(term);
        let matchesFilter = currentFilter === 'all' || r.usta === currentFilter;
        return matchesSearch && matchesFilter;
    });
    
    if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:20px;">Kayıt yok</div>';
        return;
    }
    
    container.innerHTML = '';
    filtered.sort((a,b) => b.id - a.id).forEach(r => {
        container.innerHTML += `
            <div class="record">
                <b>${r.code}</b> - ${r.device}<br>
                ${r.usta} | ${r.islem}<br>
                ${r.date}<br>
                ${r.notes ? '📝 ' + r.notes + '<br>' : ''}
                <div class="actions">
                    <span onclick="editRecord(${r.id})">Düzenle</span>
                    <span onclick="deleteRecord(${r.id})">Sil</span>
                </div>
            </div>
        `;
    });
}

function editRecord(id) {
    let rec = db.find(r => r.id === id);
    if (rec) {
        document.getElementById('device').value = rec.device;
        document.getElementById('code').value = rec.code;
        document.getElementById('usta').value = rec.usta;
        document.getElementById('islem').value = rec.islem;
        document.getElementById('notes').value = rec.notes || '';
        editingId = id;
        toggleSidebar();
    }
}

function deleteRecord(id) {
    if (confirm('Silmek istediğinize emin misiniz?')) {
        database.ref('kayitlar/' + id).remove()
            .then(() => alert('Kayıt silindi'));
    }
}

// Sayfa yüklendiğinde
loadData();
</script>
</body>
</html>
