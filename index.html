<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Yazılım - Sade Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background: #eef4fa;
            padding: 20px;
        }
        .app {
            max-width: 1300px;
            margin: 0 auto;
            background: white;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 5px 20px #b0c8e0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #0a3852;
        }
        .menu-acma {
            font-size: 32px;
            cursor: pointer;
            background: #dae8fc;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .giris-btns {
            display: flex;
            gap: 12px;
        }
        .giris-btn {
            padding: 12px 28px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            background: #dae8fc;
            color: #0a3852;
        }
        .giris-btn.admin {
            background: #0a3852;
            color: white;
        }
        .ana-yapi {
            display: flex;
            gap: 25px;
        }
        .kategori-menu {
            width: 260px;
            background: #f5f9ff;
            border-radius: 25px;
            padding: 20px;
            transition: 0.3s;
            border: 1px solid #c5d9f0;
        }
        .kategori-menu.kapali {
            width: 65px;
        }
        .kategori-menu.kapali span {
            display: none;
        }
        .kategori-baslik {
            font-weight: bold;
            color: #0a3852;
            margin: 15px 0;
        }
        .kategori {
            padding: 12px 18px;
            margin: 6px 0;
            border-radius: 40px;
            cursor: pointer;
            background: white;
            border: 1px solid #c5d9f0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .kategori.aktif {
            background: #0a3852;
            color: white;
        }
        .icerik {
            flex: 1;
        }
        .arama {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }
        .arama input {
            flex: 1;
            padding: 16px 22px;
            border-radius: 50px;
            border: 1px solid #c5d9f0;
            font-size: 16px;
        }
        .arama button {
            padding: 16px 35px;
            border-radius: 50px;
            border: none;
            background: #0a3852;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .ekleme-butonlari {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 25px 0;
            padding: 15px 0;
            border-top: 2px dashed #c5d9f0;
            border-bottom: 2px dashed #c5d9f0;
        }
        .sayi-buton {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #0a3852;
            background: white;
            font-size: 20px;
            font-weight: bold;
            color: #0a3852;
            cursor: pointer;
        }
        .ekle-form {
            background: #f5f9ff;
            border-radius: 25px;
            padding: 25px;
            margin: 25px 0;
        }
        .form-grup {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .form-input {
            flex: 1;
            padding: 16px;
            border-radius: 50px;
            border: 1px solid #c5d9f0;
            min-width: 150px;
        }
        .ekle-buton {
            padding: 16px 40px;
            background: #0a3852;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
        }
        .urun-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 25px;
        }
        .urun-kart {
            background: #f5f9ff;
            border-radius: 25px;
            padding: 20px;
            border: 1px solid #c5d9f0;
        }
        .urun-fiyat {
            font-size: 26px;
            font-weight: bold;
            color: #0a3852;
            margin: 12px 0;
        }
        .urun-islem {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }
        .duzenle, .sil {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
        .duzenle {
            background: #c5d9f0;
        }
        .sil {
            background: #ffd9d9;
        }
        @media (max-width: 900px) {
            .urun-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- HEADER -->
    <div class="header">
        <div class="menu-acma" onclick="menuyuAcKapa()">☰</div>
        <div class="logo">FULL YAZILIM</div>
        <div class="giris-btns">
            <button class="giris-btn" onclick="misafirGoster()">👤 Misafir</button>
            <button class="giris-btn admin" onclick="adminGiris()">🔐 Yönetici</button>
        </div>
    </div>

    <!-- ANA YAPI -->
    <div class="ana-yapi">
        <!-- SOL MENÜ - KATEGORİLER -->
        <div class="kategori-menu" id="kategoriMenu">
            <div class="kategori-baslik">KATEGORİLER</div>
            <div class="kategori aktif" onclick="kategoriSec('tum')">
                <span>📋</span> <span>Tümü</span>
            </div>
            <div class="kategori" onclick="kategoriSec('Finans')">
                <span>💰</span> <span>Finans</span>
            </div>
            <div class="kategori" onclick="kategoriSec('Perakende')">
                <span>🏪</span> <span>Perakende</span>
            </div>
            <div class="kategori" onclick="kategoriSec('E-ticaret')">
                <span>🛒</span> <span>E-ticaret</span>
            </div>
            <div class="kategori" onclick="kategoriSec('CRM')">
                <span>👥</span> <span>CRM</span>
            </div>
            <div class="kategori" onclick="kategoriSec('Sağlık')">
                <span>⚕️</span> <span>Sağlık</span>
            </div>
            <div class="kategori" onclick="kategoriSec('Eğitim')">
                <span>📚</span> <span>Eğitim</span>
            </div>
            <div class="kategori" onclick="kategoriSec('Üretim')">
                <span>🏭</span> <span>Üretim</span>
            </div>
        </div>

        <!-- SAĞ İÇERİK -->
        <div class="icerik" id="icerikAlani">
            <!-- İÇERİK JAVASCRIPT İLE DOLDURULACAK -->
        </div>
    </div>
</div>

<script>
// VERİLER
let yazilimlar = [
    { id: 1, ad: "Muhasebe Pro", fiyat: 12500, kategori: "Finans", aciklama: "Muhasebe programı" },
    { id: 2, ad: "POS Sistemi", fiyat: 8400, kategori: "Perakende", aciklama: "Satış takip" },
    { id: 3, ad: "E-Ticaret Paketi", fiyat: 19900, kategori: "E-ticaret", aciklama: "Online satış" }
];

let musteriler = [];
let seciliKategori = "tum";
let aramaMetni = "";

// MENÜ AÇ/KAPA
function menuyuAcKapa() {
    document.getElementById('kategoriMenu').classList.toggle('kapali');
}

// KATEGORİ SEÇ
function kategoriSec(kategori) {
    seciliKategori = kategori;
    
    // Aktif sınıfını güncelle
    document.querySelectorAll('.kategori').forEach(el => {
        el.classList.remove('aktif');
        if(el.innerHTML.includes(kategori === 'tum' ? 'Tümü' : kategori)) {
            el.classList.add('aktif');
        }
    });
    
    urunleriGoster();
}

// ARAMA
function ara() {
    aramaMetni = document.getElementById('aramaInput').value.toLowerCase();
    urunleriGoster();
}

// ÜRÜNLERİ GÖSTER
function urunleriGoster() {
    let filtreli = yazilimlar;
    
    // Kategori filtre
    if(seciliKategori !== 'tum') {
        filtreli = filtreli.filter(u => u.kategori === seciliKategori);
    }
    
    // Arama filtre
    if(aramaMetni) {
        filtreli = filtreli.filter(u => 
            u.ad.toLowerCase().includes(aramaMetni) || 
            u.aciklama.toLowerCase().includes(aramaMetni)
        );
    }
    
    let html = `
        <div class="arama">
            <input type="text" id="aramaInput" placeholder="Yazılım ara..." value="${aramaMetni}">
            <button onclick="ara()">Ara</button>
        </div>
    `;
    
    // 2-3-4-5-6-7-8-9 butonları
    html += `<div class="ekleme-butonlari">`;
    for(let i = 2; i <= 9; i++) {
        html += `<button class="sayi-buton" onclick="hizliEkle(${i})">${i}</button>`;
    }
    html += `</div>`;
    
    // Manuel ekleme formu (FİYATI SEN GİR)
    html += `
        <div class="ekle-form">
            <div class="form-grup">
                <input type="text" id="yeniAd" class="form-input" placeholder="Yazılım adı">
                <input type="number" id="yeniFiyat" class="form-input" placeholder="Fiyat ₺">
                <select id="yeniKategori" class="form-input">
                    <option value="Finans">Finans</option>
                    <option value="Perakende">Perakende</option>
                    <option value="E-ticaret">E-ticaret</option>
                    <option value="CRM">CRM</option>
                    <option value="Sağlık">Sağlık</option>
                    <option value="Eğitim">Eğitim</option>
                    <option value="Üretim">Üretim</option>
                </select>
            </div>
            <div class="form-grup">
                <input type="text" id="yeniAciklama" class="form-input" placeholder="Açıklama">
                <button class="ekle-buton" onclick="manuelEkle()">YAZILIM EKLE</button>
            </div>
        </div>
    `;
    
    // Ürün grid
    if(filtreli.length === 0) {
        html += `<p style="text-align:center; padding:40px;">Ürün bulunamadı</p>`;
    } else {
        html += `<div class="urun-grid">`;
        filtreli.forEach(u => {
            html += `
                <div class="urun-kart">
                    <div style="font-weight:bold; color:#0a3852;">${u.ad}</div>
                    <div style="color:#666;">${u.aciklama}</div>
                    <div class="urun-fiyat">${u.fiyat} ₺</div>
                    <div style="margin-bottom:8px;">Kategori: ${u.kategori}</div>
                    <div class="urun-islem">
                        <button class="duzenle" onclick="fiyatDuzenle(${u.id})">✏️ Fiyat Düzenle</button>
                        <button class="sil" onclick="urunSil(${u.id})">🗑️ Sil</button>
                    </div>
                </div>
            `;
        });
        html += `</div>`;
    }
    
    document.getElementById('icerikAlani').innerHTML = html;
}

// HIZLI EKLE (2-9 arası)
function hizliEkle(adet) {
    for(let i = 0; i < adet; i++) {
        let yeniId = yazilimlar.length + 1;
        yazilimlar.push({
            id: yeniId,
            ad: `Ürün ${yeniId}`,
            fiyat: 10000,
            kategori: "Genel",
            aciklama: "Yeni ürün"
        });
    }
    urunleriGoster();
    alert(adet + " ürün eklendi. Fiyatları düzenleyebilirsin.");
}

// MANUEL EKLE (FİYATI SEN GİRİYORSUN)
function manuelEkle() {
    let ad = document.getElementById('yeniAd')?.value;
    let fiyat = parseFloat(document.getElementById('yeniFiyat')?.value);
    let kategori = document.getElementById('yeniKategori')?.value;
    let aciklama = document.getElementById('yeniAciklama')?.value || "Açıklama yok";
    
    if(!ad || !fiyat) {
        alert("Ad ve fiyat girmelisin!");
        return;
    }
    
    yazilimlar.push({
        id: yazilimlar.length + 1,
        ad: ad,
        fiyat: fiyat,
        kategori: kategori,
        aciklama: aciklama
    });
    
    // Formu temizle
    document.getElementById('yeniAd').value = '';
    document.getElementById('yeniFiyat').value = '';
    document.getElementById('yeniAciklama').value = '';
    
    urunleriGoster();
}

// FİYAT DÜZENLE
function fiyatDuzenle(id) {
    let urun = yazilimlar.find(u => u.id === id);
    let yeniFiyat = prompt(urun.ad + " yeni fiyatı:", urun.fiyat);
    if(yeniFiyat && !isNaN(yeniFiyat)) {
        urun.fiyat = parseFloat(yeniFiyat);
        urunleriGoster();
    }
}

// ÜRÜN SİL
function urunSil(id) {
    if(confirm("Silmek istediğine emin misin?")) {
        yazilimlar = yazilimlar.filter(u => u.id !== id);
        urunleriGoster();
    }
}

// MİSAFİR PANELİ
function misafirGoster() {
    let html = `
        <div style="max-width:500px; margin:30px auto;">
            <div style="background:#f5f9ff; border-radius:30px; padding:40px;">
                <h2 style="margin-bottom:25px;">👤 Misafir Girişi</h2>
                <input type="email" id="misafirEmail" placeholder="E-posta" style="width:100%; padding:15px; border-radius:30px; border:1px solid #c5d9f0; margin-bottom:15px;">
                <input type="password" id="misafirSifre" placeholder="Şifre" style="width:100%; padding:15px; border-radius:30px; border:1px solid #c5d9f0; margin-bottom:20px;">
                <button onclick="misafirKayit()" style="width:100%; padding:15px; background:#0a3852; color:white; border:none; border-radius:30px; font-weight:bold;">Hesap Aç</button>
            </div>
        </div>
    `;
    document.getElementById('icerikAlani').innerHTML = html;
}

function misafirKayit() {
    let email = document.getElementById('misafirEmail')?.value;
    let sifre = document.getElementById('misafirSifre')?.value;
    
    if(email && sifre) {
        musteriler.push({email: email, sifre: sifre, tarih: new Date().toLocaleString()});
        alert("Hesap oluşturuldu!");
        urunleriGoster();
    }
}

// YÖNETİCİ GİRİŞİ
function adminGiris() {
    let sifre = prompt("Yönetici şifresi:");
    if(sifre === "6161") {
        adminPanel();
    } else {
        alert("Yanlış şifre!");
    }
}

function adminPanel() {
    let musteriListe = musteriler.map(m => 
        `<tr><td>${m.email}</td><td>${m.sifre}</td><td>${m.tarih}</td></tr>`
    ).join('');
    
    let html = `
        <div style="background:#f5f9ff; border-radius:30px; padding:25px; margin-bottom:25px;">
            <h3>🔐 Yönetici Paneli</h3>
        </div>
        
        <!-- 2-9 butonları burada da var -->
        <div class="ekleme-butonlari">
            ${[2,3,4,5,6,7,8,9].map(i => `<button class="sayi-buton" onclick="hizliEkle(${i})">${i}</button>`).join('')}
        </div>
        
        <!-- Manuel ekleme formu -->
        <div class="ekle-form">
            <div class="form-grup">
                <input type="text" id="yeniAd" class="form-input" placeholder="Yazılım adı">
                <input type="number" id="yeniFiyat" class="form-input" placeholder="Fiyat ₺">
                <select id="yeniKategori" class="form-input">
                    <option value="Finans">Finans</option>
                    <option value="Perakende">Perakende</option>
                    <option value="E-ticaret">E-ticaret</option>
                </select>
            </div>
            <button class="ekle-buton" onclick="manuelEkle()">YAZILIM EKLE</button>
        </div>
        
        <h3 style="margin:25px 0 15px;">👥 Müşteri Listesi</h3>
        <table style="width:100%; border-collapse:collapse; background:white; border-radius:20px; overflow:hidden;">
            <tr style="background:#0a3852; color:white;"><th>E-posta</th><th>Şifre</th><th>Tarih</th></tr>
            ${musteriListe || '<tr><td colspan="3" style="text-align:center; padding:20px;">Müşteri yok</td></tr>'}
        </table>
    `;
    
    document.getElementById('icerikAlani').innerHTML = html;
}

// BAŞLANGIÇ
urunleriGoster();
</script>
</body>
</html>
