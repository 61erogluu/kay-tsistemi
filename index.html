<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PRO-FIX Modern iOS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

body{
  margin:0;
  font-family: 'Roboto', sans-serif;
  background:#0d0d0f;
  color:white;
  padding:15px;
}
h2{margin-bottom:15px;color:#0a84ff;}
input,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  background:#1c1c1f;
  border:1px solid #333;
  border-radius:12px;
  color:white;
  font-size:16px;
}
button,.opt-btn{
  width:100%;
  padding:14px;
  margin:6px 0;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  background:#0a84ff;
  color:white;
  border:none;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  font-size:16px;
  transition:0.2s all;
  box-shadow:0 4px 8px rgba(0,0,0,0.3);
}
button:hover,.opt-btn:hover{transform:scale(1.02);box-shadow:0 6px 12px rgba(0,0,0,0.4);}
.opt-btn.active{background:#32d74b;color:#000;}
.section{margin-top:15px;margin-bottom:10px;font-weight:bold;color:#ccc;}
#records{margin-top:20px;}
.record{
  background:#1c1c1f;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  box-shadow:0 4px 8px rgba(0,0,0,0.3);
  transition:0.2s all;
}
.record:hover{transform:scale(1.01);box-shadow:0 6px 12px rgba(0,0,0,0.4);}
</style>
</head>
<body>

<h2>PRO-FIX Modern iOS Panel</h2>

<div class="section">1. Servis Kodu</div>
<input id="code" placeholder="Örn: 123456">

<div class="section">2. Cihaz</div>
<input id="device" placeholder="Örn: LG 42LB">

<div class="section">3. Usta (manuel)</div>
<input id="ustaInput" placeholder="Kadir / Mehmet vb.">

<div class="section">4. İşlem Seçimi</div>
<div class="opt-btn" id="emmc" ontouchstart="selectIslem('EMMC',this)">EMMC Değişimi</div>
<div class="opt-btn" id="anakart" ontouchstart="selectIslem('Anakart',this)">Anakart Tamiri</div>
<div class="opt-btn" id="diger" ontouchstart="selectIslem('DİĞER',this)">DİĞER / Manuel Yaz</div>

<textarea id="manual" placeholder="Manuel işlem (DİĞER seçildiğinde)" rows="2"></textarea>

<button ontouchstart="saveData()">Kaydet</button>

<h3>Kayıtlı Servisler</h3>
<div id="records"></div>

<script>
let db = JSON.parse(localStorage.getItem('profix_db')) || [];
let selectedIslem = '';

function selectIslem(name,el){
  selectedIslem = name;
  document.querySelectorAll('.opt-btn').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
}

function saveData(){
  let code = document.getElementById('code').value.trim();
  let device = document.getElementById('device').value.trim();
  let usta = document.getElementById('ustaInput').value.trim();
  let manual = document.getElementById('manual').value.trim();
  
  let finalIslem = selectedIslem==='DİĞER'?manual:selectedIslem;
  
  if(!code || !device || !usta || !finalIslem){
    alert('Lütfen tüm alanları doldurun!');
    return;
  }
  
  let data = {id:Date.now(), code, device, usta, islem:finalIslem, date:new Date().toLocaleString()};
  db.unshift(data);
  localStorage.setItem('profix_db',JSON.stringify(db));
  
  renderRecords();
  
  document.getElementById('code').value='';
  document.getElementById('device').value='';
  document.getElementById('ustaInput').value='';
  document.getElementById('manual').value='';
  selectedIslem='';
  document.querySelectorAll('.opt-btn').forEach(x=>x.classList.remove('active'));
  
  alert('Kaydedildi!');
}

function renderRecords(){
  let container = document.getElementById('records');
  container.innerHTML='';
  db.forEach(item=>{
    let div = document.createElement('div');
    div.className='record';
    div.innerHTML=`<b>${item.code}</b> - ${item.device}<br>${item.usta} | ${item.islem}<br>${item.date}`;
    container.appendChild(div);
  });
}

renderRecords();
</script>

</body>
</html>
