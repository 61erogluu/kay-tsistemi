<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>NOVA | Profesyonel Sesli Asistan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(145deg, #0B1120 0%, #0F172A 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #E2E8F0;
        }
        .top-bar {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.3);
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38BDF8, #818CF8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            background: rgba(255,255,255,0.05);
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            color: #E2E8F0;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
        }
        .btn-primary {
            background: #3B82F6;
            color: white;
        }
        .mic-active {
            background: #EF4444;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1);}
            50% { opacity: 0.7; transform: scale(0.98);}
            100% { opacity: 1; transform: scale(1);}
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 24px;
            line-height: 1.45;
            font-size: 15px;
            animation: fadeIn 0.2s ease;
        }
        .user {
            background: #3B82F6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .ai {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(4px);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .input-area {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(56, 189, 248, 0.2);
        }
        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border: none;
            border-radius: 40px;
            background: #1E293B;
            color: white;
            font-size: 15px;
        }
        .status {
            font-size: 11px;
            text-align: center;
            padding: 6px;
            background: #0F172A;
            color: #94A3B8;
        }
        .history-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1E293B;
            border-radius: 24px 24px 0 0;
            max-height: 60%;
            overflow-y: auto;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s;
            z-index: 1000;
        }
        .history-panel.open {
            transform: translateY(0);
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0F172A; }
        ::-webkit-scrollbar-thumb { background: #3B82F6; border-radius: 10px; }
    </style>
</head>
<body>
<div class="top-bar">
    <div class="logo">✦ NOVA ASİSTAN</div>
    <div class="btn-group">
        <button id="newChatBtn" class="btn">+ Yeni Sohbet</button>
        <button id="memoryBtn" class="btn">🧠 Bilgi Bankam</button>
        <button id="historyBtn" class="btn">📜 Geçmiş</button>
        <select id="voiceGender" class="btn">
            <option value="erkek">Erkek Ses</option>
            <option value="kadin">Kadın Ses</option>
        </select>
        <button id="micToggleBtn" class="btn btn-primary">🎤 Mikrofon Kapalı</button>
    </div>
</div>
<div id="chat"></div>
<div class="input-area">
    <input type="text" id="userInput" placeholder="Bir şey sor veya söyle...">
    <button id="sendBtn" class="btn btn-primary">Gönder</button>
</div>
<div class="status" id="status">✨ Nova hazır. Naber?</div>
<div id="historyPanel" class="history-panel">
    <h3>Sohbet Geçmişi</h3>
    <div id="historyList"></div>
    <button id="closeHistory" class="btn" style="margin-top:12px; width:100%">Kapat</button>
</div>

<script>
    // ==================== API KEY'LER (ENTEGRE) ====================
    const GEMINI_API_KEY = "AIzaSyD0yFRs1uz-AV5WGwrYQO9wVm1km9Mp01k";
    const TAVILY_API_KEY = "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";
    
    // ==================== KALICI HAFIZA (Sohbetten bağımsız) ====================
    let userMemory = {};
    
    function loadMemory() {
        const saved = localStorage.getItem("nova_memory");
        if (saved) { try { userMemory = JSON.parse(saved); } catch(e) {} }
    }
    function saveMemory() {
        localStorage.setItem("nova_memory", JSON.stringify(userMemory));
    }
    function addToMemory(key, value) {
        userMemory[key.toLowerCase()] = value;
        saveMemory();
        setStatus(`📝 Hatırladım: ${key} = ${value}`);
    }
    function getFromMemory(query) {
        for (let k in userMemory) {
            if (query.toLowerCase().includes(k) || k.includes(query.toLowerCase())) {
                return userMemory[k];
            }
        }
        return null;
    }
    
    // ==================== SOHBET YÖNETİMİ ====================
    let chats = {};
    let currentChatId = null;
    
    function saveChats() {
        localStorage.setItem("nova_chats", JSON.stringify(chats));
    }
    function loadChats() {
        const saved = localStorage.getItem("nova_chats");
        if (saved) { try { chats = JSON.parse(saved); } catch(e) {} }
        if (Object.keys(chats).length === 0) {
            const id = Date.now().toString();
            chats[id] = { name: "Ana Sohbet", messages: [] };
            currentChatId = id;
        } else {
            currentChatId = Object.keys(chats)[0];
        }
        saveChats();
        renderCurrentChat();
    }
    function renderCurrentChat() {
        if (!currentChatId || !chats[currentChatId]) return;
        const container = document.getElementById("chat");
        container.innerHTML = "";
        for (let msg of chats[currentChatId].messages) {
            const div = document.createElement("div");
            div.className = `message ${msg.role === "user" ? "user" : "ai"}`;
            div.innerText = msg.content;
            container.appendChild(div);
        }
        container.scrollTop = container.scrollHeight;
    }
    function addMessage(role, content) {
        if (!currentChatId) return;
        chats[currentChatId].messages.push({ role, content });
        if (chats[currentChatId].messages.length > 100) chats[currentChatId].messages = chats[currentChatId].messages.slice(-100);
        saveChats();
        renderCurrentChat();
    }
    function newChat() {
        let name = prompt("Sohbet adı (örn: İş, Dertleşme, Proje)");
        if (!name) name = "Sohbet " + (Object.keys(chats).length+1);
        const id = Date.now().toString();
        chats[id] = { name, messages: [] };
        currentChatId = id;
        saveChats();
        renderCurrentChat();
        setStatus(`"${name}" başlatıldı. Bilgi bankan ayrı korunuyor.`);
    }
    function deleteChat(id) {
        if (Object.keys(chats).length === 1) { setStatus("Son sohbeti silemezsin", true); return; }
        delete chats[id];
        currentChatId = Object.keys(chats)[0];
        saveChats();
        renderCurrentChat();
        setStatus("Sohbet silindi. Bilgi bankan etkilenmedi.");
    }
    function showHistory() {
        const panel = document.getElementById("historyPanel");
        const listDiv = document.getElementById("historyList");
        listDiv.innerHTML = "";
        for (let id in chats) {
            const item = document.createElement("div");
            item.style.padding = "12px";
            item.style.borderBottom = "1px solid #334155";
            item.style.cursor = "pointer";
            item.innerHTML = `${chats[id].name} (${chats[id].messages.length} mesaj) <button style="float:right; background:none; border:none; color:#EF4444; cursor:pointer;" onclick="event.stopPropagation(); deleteChat('${id}'); document.getElementById('historyPanel').classList.remove('open'); showHistory();">🗑</button>`;
            item.onclick = () => {
                currentChatId = id;
                renderCurrentChat();
                panel.classList.remove("open");
                setStatus(`"${chats[id].name}" açıldı`);
            };
            listDiv.appendChild(item);
        }
        panel.classList.add("open");
    }
    
    // ==================== WEB ARAMA (TAVILY) ====================
    async function searchWeb(query) {
        if (!TAVILY_API_KEY || TAVILY_API_KEY === "YOUR_TAVILY_API_KEY") {
            return "Web arama için Tavily API key gerekli.";
        }
        try {
            const res = await fetch("https://api.tavily.com/search", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    api_key: TAVILY_API_KEY,
                    query: query,
                    search_depth: "basic",
                    max_results: 3
                })
            });
            const data = await res.json();
            if (data.results && data.results.length) {
                return data.results.map(r => r.content).join("\n");
            }
            return "Arama sonucu bulunamadı.";
        } catch(e) {
            return "Web arama hatası: " + e.message;
        }
    }
    
    // ==================== GEMINI ====================
    async function askGemini(prompt, needsSearch = false) {
        let context = "";
        if (needsSearch) {
            setStatus("🌐 Web'de araştırıyorum...");
            const searchResult = await searchWeb(prompt);
            context = `\n\nWeb'de bulduğum bilgiler:\n${searchResult}\n\nBu bilgilere göre cevap ver. Eğer hava durumu ise derece ve durumu söyle. Eğer doğum günü veya etkinlik varsa saat ve kişiyi belirt.`;
        }
        
        let memoryInfo = "";
        for (let k in userMemory) {
            if (prompt.toLowerCase().includes(k) || prompt.toLowerCase().includes("doğum") || prompt.toLowerCase().includes("hatırla")) {
                memoryInfo += `\n[Hatırladığım bilgi: ${k} = ${userMemory[k]}]`;
            }
        }
        
        const fullPrompt = `Sen benim yakın arkadaşım ve profesyonel asistanım. Adın Nova. Samimi, dürüst, gerekiyorsa "Bu saçma" de. 
        Kullanıcının bilgilerini hatırla: ${memoryInfo}
        Kullanıcının sorusu: ${prompt}
        ${context}
        Arkadaş gibi, doğal Türkçe cevap ver. Cevabın kısa ve net olsun. Hava durumu, saat, tarih, doğum günü, etkinlik gibi güncel bilgileri web aramasından kullan.`;
        
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: fullPrompt }] }]
                })
            });
            if (!res.ok) {
                const err = await res.text();
                throw new Error("Gemini hatası " + res.status);
            }
            const data = await res.json();
            return data.candidates[0].content.parts[0].text;
        } catch(e) {
            return "Bağlantı hatası: " + e.message;
        }
    }
    
    // ==================== KONUŞMA ====================
    let isMicActive = false;
    let recognition = null;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'tr-TR';
        recognition.continuous = true;
        recognition.interimResults = false;
    }
    
    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'tr-TR';
        utterance.rate = 0.9;
        const gender = document.getElementById("voiceGender").value;
        window.speechSynthesis.getVoices().then(voices => {
            let selected = voices.find(v => v.lang.includes("tr") && (gender === "erkek" ? v.name.toLowerCase().includes("male") : v.name.toLowerCase().includes("female")));
            if (selected) utterance.voice = selected;
            window.speechSynthesis.speak(utterance);
        });
        setStatus("🔊 Konuşuyor...");
    }
    
    function startMic() {
        if (!recognition) { setStatus("Ses girişi desteklenmiyor", true); return; }
        if (isMicActive) return;
        isMicActive = true;
        recognition.start();
        setStatus("🎤 Dinliyorum, konuş...");
        document.getElementById("micToggleBtn").classList.add("mic-active");
        document.getElementById("micToggleBtn").innerHTML = "🎤 Mikrofon Açık";
        recognition.onresult = async (event) => {
            let transcript = "";
            for (let i = event.resultIndex; i < event.results.length; i++) {
                if (event.results[i].isFinal) transcript += event.results[i][0].transcript;
            }
            if (transcript.trim()) {
                document.getElementById("userInput").value = transcript;
                await sendMessage(transcript);
            }
        };
        recognition.onerror = (e) => { if(e.error !== "no-speech") setStatus("Ses hatası", true); };
        recognition.onend = () => { if(isMicActive) recognition.start(); };
    }
    function stopMic() {
        if (recognition && isMicActive) {
            isMicActive = false;
            recognition.stop();
            setStatus("🎤 Mikrofon kapalı");
            document.getElementById("micToggleBtn").classList.remove("mic-active");
            document.getElementById("micToggleBtn").innerHTML = "🎤 Mikrofon Kapalı";
        }
    }
    function toggleMic() { isMicActive ? stopMic() : startMic(); }
    
    // ==================== MESAJ GÖNDER ====================
    async function sendMessage(text) {
        if (!text.trim()) return;
        document.getElementById("userInput").value = "";
        addMessage("user", text);
        setStatus("🤔 Düşünüyor...");
        
        // Bilgi ekleme (sohbetten bağımsız hafızaya)
        const memoryMatch = text.match(/(.*?)(doğum günüm|doğum günü|sevdiğim|sevdiğim renk|proje teslim|hatırla|adım|yaşım|sevgilimin adı|en sevdiğim) (.*?)$/i);
        if (memoryMatch && !text.includes("?")) {
            const key = memoryMatch[2];
            const value = memoryMatch[3] || memoryMatch[1];
            addToMemory(key, value);
            addMessage("ai", `Tamam, hatırladım: ${key} = ${value}. Bunu unutmayacağım.`);
            speakText(`Tamam, hatırladım: ${key} = ${value}`);
            return;
        }
        
        const needsSearch = text.toLowerCase().includes("hava") || text.toLowerCase().includes("kaçta") || text.toLowerCase().includes("yarın") || text.toLowerCase().includes("bugün") || text.toLowerCase().includes("doğum günü") || text.toLowerCase().includes("etkinlik") || text.toLowerCase().includes("haber") || text.toLowerCase().includes("kimin") || text.toLowerCase().includes("kaç derece");
        
        const reply = await askGemini(text, needsSearch);
        addMessage("ai", reply);
        setStatus("✅ Cevap verildi");
        speakText(reply);
    }
    
    // ==================== OLAY BAĞLANTILARI ====================
    document.getElementById("sendBtn").onclick = () => sendMessage(document.getElementById("userInput").value);
    document.getElementById("micToggleBtn").onclick = toggleMic;
    document.getElementById("newChatBtn").onclick = newChat;
    document.getElementById("historyBtn").onclick = showHistory;
    document.getElementById("closeHistory").onclick = () => document.getElementById("historyPanel").classList.remove("open");
    document.getElementById("memoryBtn").onclick = () => {
        let info = "📚 Bilgi Bankam:\n";
        for (let k in userMemory) info += `- ${k}: ${userMemory[k]}\n`;
        alert(info || "Henüz bilgi kaydetmedin. '13 Nisan doğum günüm' dersen aklımda tutarım.");
    };
    document.getElementById("userInput").addEventListener("keypress", (e) => { if(e.key === "Enter") sendMessage(e.target.value); });
    
    function setStatus(msg, isErr=false) {
        const st = document.getElementById("status");
        st.innerText = msg;
        setTimeout(() => { if(st.innerText === msg) st.innerText = "Hazır"; }, 3000);
    }
    
    loadMemory();
    loadChats();
    if (chats[currentChatId]?.messages.length === 0) {
        setTimeout(() => {
            addMessage("ai", "Nova burada. Naber? Bugün nasıl geçti? Anlat dinleyeyim. İstersen bir bilgi ver, aklımda tutayım. Mesela '13 Nisan doğum günüm' de.");
            speakText("Nova burada. Naber? Anlat dinleyeyim.");
        }, 500);
    }
</script>
</body>
</html>
