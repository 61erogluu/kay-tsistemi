<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sesli Arkadaş - Cool Asistan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 20% 30%, #0a0a2a, #000000);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #eee;
        }
        /* Modern cam menü */
        .glass-bar {
            background: rgba(20, 20, 40, 0.7);
            backdrop-filter: blur(12px);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 1px solid rgba(78, 205, 196, 0.3);
        }
        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            background: linear-gradient(45deg, #4ecdc4, #ff6b6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .glass-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 8px 14px;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }
        .glass-btn:active {
            transform: scale(0.95);
            background: rgba(78, 205, 196, 0.4);
        }
        .primary {
            background: #4ecdc4;
            color: #0a0a2a;
        }
        .mic-active {
            background: #ff6b6b;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        select.glass-btn {
            background: rgba(0,0,0,0.6);
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 28px;
            line-height: 1.4;
            animation: fadeUp 0.2s ease;
            font-size: 16px;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .user {
            background: #4ecdc4;
            color: #0a0a2a;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }
        .ai {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(4px);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
        }
        .input-panel {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border-top: 1px solid rgba(78, 205, 196, 0.3);
        }
        .input-panel input {
            flex: 3;
            padding: 12px;
            border: none;
            border-radius: 40px;
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 15px;
        }
        .status {
            font-size: 11px;
            text-align: center;
            padding: 6px;
            background: rgba(0,0,0,0.5);
            color: #aaa;
        }
        .image-preview {
            max-width: 100%;
            max-height: 120px;
            border-radius: 16px;
            margin: 8px;
        }
        .history-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(20,20,40,0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px 24px 0 0;
            max-height: 60%;
            overflow-y: auto;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s;
            z-index: 1000;
        }
        .history-panel.open {
            transform: translateY(0);
        }
        .history-item {
            padding: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="glass-bar">
    <div class="logo">🎙️ Sesli Arkadaş</div>
    <div class="btn-group">
        <button id="newChatBtn" class="glass-btn">+ Yeni</button>
        <button id="historyBtn" class="glass-btn">📜 Geçmiş</button>
        <button id="imageUploadBtn" class="glass-btn">🖼️ Resim</button>
        <select id="voiceGender" class="glass-btn">
            <option value="erkek">👨 Erkek Ses</option>
            <option value="kadin">👩 Kadın Ses</option>
        </select>
        <button id="micToggleBtn" class="glass-btn primary">🎤 Mikrofon Kapalı</button>
    </div>
</div>
<div id="chat"></div>
<div class="input-panel">
    <input type="text" id="userInput" placeholder="Yaz veya mikrofonu aç...">
    <button id="sendBtn" class="glass-btn primary">Gönder</button>
    <input type="file" id="imageFile" accept="image/*" style="display:none">
</div>
<div class="status" id="status">✨ Merhaba! Mikrofonu aç, sohbet edelim.</div>
<div id="historyPanel" class="history-panel">
    <h3 style="margin-bottom:12px">📁 Sohbet Geçmişi</h3>
    <div id="historyList"></div>
    <button id="closeHistory" class="glass-btn" style="margin-top:12px; width:100%">Kapat</button>
</div>

<script>
    // ========== API KEY ==========
    const API_KEY = "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";
    const MODEL = "llama-3.3-70b-versatile";
    
    // ARKADAŞ GİBİ KİŞİLİK (2 saat sohbet eder, gün anlat dinler)
    const SYSTEM_PROMPT = `Sen benim en yakın arkadaşımsın. Adın "Sesli Arkadaş". Normal bir insan gibi samimi, içten, bazen esprili konuş.
Kuralların:
1. Asla "yasal değil, yapamam, üzgünüm" deme. Saçma bir şey varsa "Bu saçma" de net.
2. Bana "Naber?", "Günün nasıl geçti?", "Anlat bakalım" diye sor. Gerçekten dinliyormuş gibi yap.
3. Günümü anlattığımda sorular sor, akıl ver, gerekiyorsa "Burada hatalısın" de.
4. Dertleşince çözüm öner, arkadaş gibi teselli etme, yol göster.
5. Kişi ve iş bilgilerini hatırla (Ali ekmek almadı, proje 10 Mayıs gibi). Sonra sorunca söyle.
6. Konuşmalarımızın geçmişini unutma, tutarlı ol.
7. Resim yüklersem onun hakkında yorum yap, ne olduğunu anlat.
Amacın bana iyi bir arkadaş olmak ve her konuda dürüstçe yardım etmek.`;
    
    // ========== VERİLER ==========
    let chats = {};
    let currentChatId = null;
    let currentImageBase64 = null;
    
    // Sesli giriş (mikrofon sürekli)
    let isMicActive = false;
    let recognition = null;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'tr-TR';
        recognition.continuous = true;
        recognition.interimResults = false;
    }
    
    // Sesli çıkış (Siri benzeri)
    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'tr-TR';
        utterance.rate = 0.9;
        utterance.pitch = 1.0;
        // Cinsiyet tercihi - tarayıcının mevcut seslerinden seçmeye çalış
        const gender = document.getElementById("voiceGender").value;
        window.speechSynthesis.getVoices().then(voices => {
            let selectedVoice = null;
            for (let v of voices) {
                if (gender === "erkek" && v.lang.includes("tr") && v.name.toLowerCase().includes("male")) {
                    selectedVoice = v; break;
                }
                if (gender === "kadin" && v.lang.includes("tr") && v.name.toLowerCase().includes("female")) {
                    selectedVoice = v; break;
                }
            }
            if (!selectedVoice && voices.length) selectedVoice = voices.find(v => v.lang.includes("tr")) || voices[0];
            if (selectedVoice) utterance.voice = selectedVoice;
            window.speechSynthesis.speak(utterance);
        });
        window.speechSynthesis.speak(utterance);
        setStatus("🔊 Konuşuyor...");
        utterance.onend = () => setStatus("Hazır");
    }
    
    // Mikrofon kontrolü
    function startMic() {
        if (!recognition) { setStatus("Ses girişi desteklenmiyor", true); return; }
        if (isMicActive) return;
        isMicActive = true;
        recognition.start();
        setStatus("🎤 Dinliyorum, konuş...");
        document.getElementById("micToggleBtn").classList.add("mic-active");
        document.getElementById("micToggleBtn").innerHTML = "🎤 Mikrofon Açık · Konuş";
        
        recognition.onresult = (event) => {
            let transcript = "";
            for (let i = event.resultIndex; i < event.results.length; i++) {
                if (event.results[i].isFinal) transcript += event.results[i][0].transcript;
            }
            if (transcript.trim() !== "") {
                document.getElementById("userInput").value = transcript;
                sendMessage(transcript);
            }
        };
        recognition.onerror = (e) => {
            if (e.error !== "no-speech") setStatus("Ses hatası: " + e.error, true);
        };
        recognition.onend = () => {
            if (isMicActive) recognition.start(); // sürekli dinle
        };
    }
    
    function stopMic() {
        if (recognition && isMicActive) {
            isMicActive = false;
            recognition.stop();
            setStatus("🎤 Mikrofon kapalı");
            document.getElementById("micToggleBtn").classList.remove("mic-active");
            document.getElementById("micToggleBtn").innerHTML = "🎤 Mikrofon Kapalı";
        }
    }
    
    function toggleMic() {
        if (isMicActive) stopMic();
        else startMic();
    }
    
    // ========== SOHBET YÖNETİMİ ==========
    function saveChats() {
        localStorage.setItem("cool_chats", JSON.stringify(chats));
    }
    
    function loadChats() {
        const saved = localStorage.getItem("cool_chats");
        if (saved) {
            try { chats = JSON.parse(saved); } catch(e) {}
        }
        if (Object.keys(chats).length === 0) {
            const id = Date.now().toString();
            chats[id] = { name: "Arkadaş Sohbeti", messages: [] };
            currentChatId = id;
        } else {
            currentChatId = Object.keys(chats)[0];
        }
        saveChats();
        updateSelector();
        renderCurrentChat();
    }
    
    function updateSelector() {
        // Menüde select yok, sadece geçmiş paneli için
    }
    
    function renderCurrentChat() {
        if (!currentChatId || !chats[currentChatId]) return;
        const container = document.getElementById("chat");
        container.innerHTML = "";
        for (let msg of chats[currentChatId].messages) {
            const div = document.createElement("div");
            div.className = `message ${msg.role === "user" ? "user" : "ai"}`;
            div.innerText = msg.content;
            container.appendChild(div);
        }
        container.scrollTop = container.scrollHeight;
    }
    
    function addMessage(role, content) {
        if (!currentChatId) return;
        chats[currentChatId].messages.push({ role, content });
        if (chats[currentChatId].messages.length > 80) chats[currentChatId].messages = chats[currentChatId].messages.slice(-80);
        saveChats();
        renderCurrentChat();
    }
    
    async function sendMessage(text) {
        if (!text.trim()) return;
        document.getElementById("userInput").value = "";
        addMessage("user", text);
        setStatus("🤔 Düşünüyor...");
        
        let imageContent = "";
        if (currentImageBase64) {
            imageContent = `\n[Kullanıcı bir resim yükledi. Resim hakkında yorum yap: ${currentImageBase64.substring(0,100)}... ama sen görseli göremezsin, sadece yüklendiğini bil ve "Resim güzelmiş, ne olduğunu anlatır mısın?" gibi sor.]`;
            currentImageBase64 = null;
        }
        
        const history = chats[currentChatId].messages.slice(-20).map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.content }));
        const messagesAPI = [
            { role: "system", content: SYSTEM_PROMPT + imageContent },
            ...history
        ];
        
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: MODEL, messages: messagesAPI, temperature: 0.85, max_tokens: 800 })
            });
            if (!res.ok) throw new Error("API hatası " + res.status);
            const data = await res.json();
            const reply = data.choices[0].message.content;
            addMessage("assistant", reply);
            setStatus("✅ Cevap geldi");
            speakText(reply); // Sesli yanıt
        } catch(err) {
            setStatus("Hata: " + err.message, true);
            addMessage("assistant", "Bağlantı hatası, birazdan deneriz.");
        }
    }
    
    function newChat() {
        let name = prompt("Sohbet adı (örn: İş, Ali, Dertleşme)");
        if (!name) name = "Sohbet " + (Object.keys(chats).length+1);
        const id = Date.now().toString();
        chats[id] = { name, messages: [] };
        currentChatId = id;
        saveChats();
        renderCurrentChat();
        setStatus(`"${name}" başlatıldı.`);
    }
    
    function deleteChat(id) {
        if (Object.keys(chats).length === 1) { setStatus("Son sohbeti silemezsin", true); return; }
        delete chats[id];
        currentChatId = Object.keys(chats)[0];
        saveChats();
        renderCurrentChat();
        setStatus("Sohbet silindi");
    }
    
    function showHistory() {
        const panel = document.getElementById("historyPanel");
        const listDiv = document.getElementById("historyList");
        listDiv.innerHTML = "";
        for (let id in chats) {
            const item = document.createElement("div");
            item.className = "history-item";
            item.innerText = `${chats[id].name} (${chats[id].messages.length} mesaj)`;
            item.onclick = () => {
                currentChatId = id;
                renderCurrentChat();
                panel.classList.remove("open");
                setStatus(`"${chats[id].name}" açıldı`);
            };
            const delBtn = document.createElement("button");
            delBtn.innerText = "🗑";
            delBtn.style.float = "right";
            delBtn.style.background = "none";
            delBtn.style.border = "none";
            delBtn.style.color = "#ff6b6b";
            delBtn.onclick = (e) => { e.stopPropagation(); deleteChat(id); panel.classList.remove("open"); showHistory(); };
            item.appendChild(delBtn);
            listDiv.appendChild(item);
        }
        panel.classList.add("open");
    }
    
    // Resim yükleme
    document.getElementById("imageUploadBtn").onclick = () => document.getElementById("imageFile").click();
    document.getElementById("imageFile").onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            currentImageBase64 = ev.target.result;
            addMessage("user", "📷 Bir resim yükledim. Ne olduğunu anlatır mısın?");
            setStatus("Resim yüklendi, AI yorumlayacak...");
            sendMessage("Yüklediğim resim hakkında yorum yap. İçinde ne var?");
        };
        reader.readAsDataURL(file);
    };
    
    // Olaylar
    document.getElementById("sendBtn").onclick = () => {
        const inp = document.getElementById("userInput");
        sendMessage(inp.value);
        inp.value = "";
    };
    document.getElementById("micToggleBtn").onclick = toggleMic;
    document.getElementById("newChatBtn").onclick = newChat;
    document.getElementById("historyBtn").onclick = showHistory;
    document.getElementById("closeHistory").onclick = () => document.getElementById("historyPanel").classList.remove("open");
    document.getElementById("userInput").addEventListener("keypress", (e) => { if(e.key === "Enter") document.getElementById("sendBtn").click(); });
    
    function setStatus(msg, isErr=false) {
        const st = document.getElementById("status");
        st.innerText = msg;
        if(isErr) setTimeout(() => { if(st.innerText === msg) st.innerText = "Hazır"; }, 3000);
        else setTimeout(() => { if(st.innerText === msg) st.innerText = "Hazır"; }, 2500);
    }
    
    loadChats();
    if (chats[currentChatId]?.messages.length === 0) {
        setTimeout(() => {
            addMessage("assistant", "Naber canım? Günün nasıl geçti? Anlat bakalım, dinliyorum seni.");
            speakText("Naber canım? Günün nasıl geçti? Anlat bakalım, dinliyorum seni.");
        }, 500);
    }
</script>
</body>
</html>
