<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İlaydaya Aşık - Parkur</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { border: 5px solid #444; box-shadow: 0 0 20px rgba(0,0,0,0.5); background: #222; }
        #msg { position: absolute; top: 20px; color: white; text-align: center; pointer-events: none; }
    </style>
</head>
<body>
    <div id="msg">
        <h1 style="color: #ff4757; margin: 0;">İLAYDAYA AŞIK</h1>
        <p>Mavi: WASD | Kırmızı: Ok Tuşları | Kendi rengindeki sıvıdan geçebilirsin!</p>
    </div>
    <canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = 800; canvas.height = 500;

const gravity = 0.6;
const friction = 0.8;

class Player {
    constructor(x, y, color, controls, type) {
        this.startX = x; this.startY = y;
        this.x = x; this.y = y;
        this.w = 25; this.h = 25;
        this.color = color;
        this.controls = controls;
        this.type = type; // 'su' veya 'ates'
        this.velX = 0; this.velY = 0;
        this.grounded = false;
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.w, this.h);
        // Göz ekleyelim
        ctx.fillStyle = "white";
        ctx.fillRect(this.x + 5, this.y + 5, 5, 5);
        ctx.fillRect(this.x + 15, this.y + 5, 5, 5);
    }

    update(keys, platforms, hazards) {
        if (keys[this.controls.up] && this.grounded) { this.velY = -12; this.grounded = false; }
        if (keys[this.controls.left]) this.velX = -4.5;
        if (keys[this.controls.right]) this.velX = 4.5;

        this.velY += gravity;
        this.x += this.velX;
        this.y += this.velY;
        this.velX *= friction;

        this.grounded = false;
        platforms.forEach(p => {
            if (this.x < p.x + p.w && this.x + this.w > p.x && this.y < p.y + p.h && this.y + this.h > p.y) {
                if (this.velY > 0 && this.y + this.h - this.velY <= p.y) {
                    this.y = p.y - this.h; this.velY = 0; this.grounded = true;
                }
            }
        });

        hazards.forEach(h => {
            if (this.x < h.x + h.w && this.x + this.w > h.x && this.y < h.y + h.h && this.y + this.h > h.y) {
                if (this.type !== h.safeType) this.reset();
            }
        });

        if (this.y > canvas.height) this.reset();
    }

    reset() { this.x = this.startX; this.y = this.startY; this.velX = 0; this.velY = 0; }
}

const platforms = [
    {x: 0, y: 450, w: 800, h: 50}, // Zemin
    {x: 150, y: 370, w: 100, h: 20},
    {x: 300, y: 300, w: 100, h: 20},
    {x: 50, y: 220, w: 120, h: 20},
    {x: 250, y: 150, w: 300, h: 20},
    {x: 650, y: 100, w: 150, h: 20}
];

const hazards = [
    {x: 400, y: 440, w: 80, h: 10, color: "#e74c3c", safeType: "ates"}, // Lav
    {x: 550, y: 440, w: 80, h: 10, color: "#3498db", safeType: "su"},   // Su
    {x: 350, y: 140, w: 50, h: 10, color: "#2ecc71", safeType: "none"} // Asit
];

const p1 = new Player(30, 400, "#3498db", {up: 'w', left: 'a', right: 'd'}, "su");
const p2 = new Player(70, 400, "#e74c3c", {up: 'ArrowUp', left: 'ArrowLeft', right: 'ArrowRight'}, "ates");

const keys = {};
window.onkeydown = (e) => keys[e.key] = true;
window.onkeyup = (e) => keys[e.key] = false;

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Platformlar
    ctx.fillStyle = "#7f8c8d";
    platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

    // Tehlikeler (Lav/Su)
    hazards.forEach(h => {
        ctx.fillStyle = h.color;
        ctx.fillRect(h.x, h.y, h.w, h.h);
    });

    // Bitiş Kapısı
    ctx.fillStyle = "#f1c40f";
    ctx.fillRect(750, 40, 40, 60);
    ctx.fillStyle = "white";
    ctx.fillText("BİTİŞ", 755, 35);

    p1.update(keys, platforms, hazards);
    p2.update(keys, platforms, hazards);
    p1.draw();
    p2.draw();

    if ((p1.x > 740 && p1.y < 100) || (p2.x > 740 && p2.y < 100)) {
        ctx.fillStyle = "rgba(0,0,0,0.8)";
        ctx.fillRect(0,0,canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.textAlign = "center";
        ctx.fillText("TEBRİKLER! İLAYDAYA AŞIK", canvas.width/2, canvas.height/2);
        return; 
    }

    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
