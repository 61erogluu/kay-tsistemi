<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO-FIX</title>

<style>
body{margin:0;font-family:Arial;background:#0d0d0f;color:white;}
header{display:flex;justify-content:space-between;padding:15px;background:#161616;}
.menu{font-size:22px;cursor:pointer;}
.container{padding:15px;}
input,select{width:100%;padding:10px;margin:6px 0;background:#1c1c1f;border:1px solid #333;color:white;border-radius:8px;}
button{width:100%;padding:12px;margin-top:10px;background:#0a84ff;border:none;color:white;border-radius:8px;}

#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;}

#panel,#admin{
position:fixed;
top:0;
right:-100%;
width:85%;
max-width:350px;
height:100%;
background:#161616;
padding:15px;
transition:0.3s;
overflow:auto;
z-index:2;
}

#panel.open,#admin.open{right:0;}
#overlay.show{display:block;}

.record{background:#1c1c1f;margin-top:10px;padding:10px;border-radius:8px;}
</style>
</head>

<body>

<header>
<div class="menu" onclick="togglePanel()" ontouchstart="togglePanel()">☰</div>
<div>PRO-FIX</div>
<div class="menu" onclick="openAdmin()" ontouchstart="openAdmin()">⋮</div>
</header>

<div class="container">

<input id="device" placeholder="Cihaz">
<input id="code" placeholder="Kod">

<select id="usta">
<option value="">Usta seç</option>
<option>Kadir</option>
<option>Mehmet</option>
</select>

<select id="islem">
<option value="">İşlem</option>
<option>BGA</option>
<option>EMMC</option>
</select>

<button onclick="save()" ontouchstart="save()">Kaydet</button>

</div>

<div id="overlay" onclick="closeAll()"></div>

<!-- KAYIT PANEL -->
<div id="panel">
<h3>Kayıtlar</h3>
<input id="search" placeholder="Ara..." onkeyup="render()">
<div id="list"></div>
</div>

<!-- ADMIN PANEL -->
<div id="admin">
<h3>Usta Analiz</h3>

<select id="filterUsta">
<option value="">Usta seç</option>
<option>Kadir</option>
<option>Mehmet</option>
</select>

<select id="filterType">
<option value="today">Bugün</option>
<option value="month">Bu Ay</option>
<option value="custom">Özel</option>
</select>

<input type="date" id="start">
<input type="date" id="end">

<button onclick="analyze()" ontouchstart="analyze()">Hesapla</button>

<h2 id="result"></h2>

</div>

<script>

let db=JSON.parse(localStorage.getItem("db"))||[];

function save(){
let d=device.value;
let c=code.value;
let u=usta.value;
let i=islem.value;

if(!d||!c||!u||!i){alert("Eksik");return;}

db.unshift({device:d,code:c,usta:u,islem:i,date:new Date().toISOString()});
localStorage.setItem("db",JSON.stringify(db));

render();
}

function render(){
let term=search.value||"";
list.innerHTML="";

db.filter(x=>x.device.includes(term)||x.code.includes(term)||x.usta.includes(term))
.forEach(x=>{
let div=document.createElement("div");
div.className="record";
div.innerHTML=`${x.code} - ${x.device}<br>${x.usta} | ${x.islem}`;
list.appendChild(div);
});
}

function togglePanel(){
panel.classList.add("open");
overlay.classList.add("show");
}

function openAdmin(){
let pass=prompt("Şifre: 1616");
if(pass==="1616"){
admin.classList.add("open");
overlay.classList.add("show");
}else{
alert("Yanlış");
}
}

function closeAll(){
panel.classList.remove("open");
admin.classList.remove("open");
overlay.classList.remove("show");
}

function analyze(){

let u=filterUsta.value;
let type=filterType.value;
let startVal=start.value;
let endVal=end.value;

let now=new Date();
let count=0;

db.forEach(x=>{
let d=new Date(x.date);

if(u && x.usta!==u) return;

if(type==="today"){
if(d.toDateString()===now.toDateString()) count++;
}
else if(type==="month"){
if(d.getMonth()===now.getMonth()) count++;
}
else if(type==="custom"){
if(startVal && endVal){
if(d>=new Date(startVal) && d<=new Date(endVal)) count++;
}
}
});

result.innerText="Toplam İş: "+count;
}

render();

</script>

</body>
</html>
