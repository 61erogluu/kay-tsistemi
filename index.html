<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO-FIX TV</title>

<style>

:root{
--bg:#000;
--card:#1c1c1e;
--border:#38383a;
--blue:#0a84ff;
--green:#30d158;
--red:#ff453a;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
background:var(--bg);
color:white;
}

/* HEADER */

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:50px 20px 20px;
background:var(--card);
border-bottom:1px solid var(--border);
}

.menu-btn{
font-size:26px;
color:var(--blue);
cursor:pointer;
}

/* FORM */

.container{
padding:20px;
}

.section{
font-size:12px;
color:#8e8e93;
margin:20px 0 10px;
font-weight:700;
}

.input{
width:100%;
padding:16px;
background:var(--card);
border:2px solid var(--border);
border-radius:12px;
color:white;
font-size:17px;
}

.input:focus{
border-color:var(--blue);
outline:none;
}

/* BUTTONS */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.opt{
background:var(--card);
border:2px solid var(--border);
padding:18px;
border-radius:12px;
text-align:center;
font-weight:700;
cursor:pointer;
}

.opt.active{
border-color:var(--blue);
background:rgba(10,132,255,.2);
}

.save{
margin-top:30px;
width:100%;
padding:20px;
border:none;
border-radius:14px;
background:var(--blue);
color:white;
font-size:18px;
font-weight:800;
}

/* SIDEBAR */

.sidebar{
position:fixed;
top:0;
right:-100%;
width:100%;
height:100%;
background:#000;
padding:60px 20px;
transition:.3s;
overflow:auto;
}

.sidebar.open{
right:0;
}

.record{
background:var(--card);
padding:15px;
border-radius:12px;
margin-bottom:10px;
border-left:4px solid var(--blue);
}

.actions{
margin-top:10px;
display:flex;
gap:10px;
}

.del{
background:var(--red);
color:white;
border:none;
padding:6px 10px;
border-radius:6px;
}

</style>

</head>

<body>

<div class="header">
<h2>PRO-FIX <span style="color:var(--blue)">TV</span></h2>
<div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<div class="container">

<div class="section">SERVİS KODU</div>
<input id="code" class="input" placeholder="6 haneli kod">

<div class="section">CİHAZ</div>
<input id="device" class="input" placeholder="Örn: LG 42LB">

<div class="section">TEKNİSYEN</div>

<div class="grid">
<div class="opt" id="kadir" onclick="selectUsta('Kadir',this)">KADİR</div>
<div class="opt" id="mehmet" onclick="selectUsta('Mehmet',this)">MEHMET</div>
</div>

<div class="section">İŞLEM</div>

<div class="opt" onclick="selectIslem('EMMC Değişimi',this)">EMMC</div>
<div class="opt" onclick="selectIslem('Anakart Tamiri',this)">ANAKART</div>
<div class="opt" onclick="showManual(this)">DİĞER</div>

<textarea id="manual" class="input" style="display:none;margin-top:10px" placeholder="Arıza yaz"></textarea>

<button class="save" onclick="save()">SİSTEME KAYDET</button>

</div>

<div class="sidebar" id="sidebar">

<h2>Kayıtlar</h2>

<input id="search" class="input" placeholder="Ara..." onkeyup="render()">

<div id="list"></div>

</div>

<script>

let db = JSON.parse(localStorage.getItem("profix_db")) || [];

let selectedUsta="";
let selectedIslem="";

/* MENU */

function toggleMenu(){

document.getElementById("sidebar").classList.toggle("open");

render();

}

/* USTA */

function selectUsta(name,el){

selectedUsta=name;

document.querySelectorAll("#kadir,#mehmet").forEach(b=>b.classList.remove("active"));

el.classList.add("active");

}

/* ISLEM */

function selectIslem(name,el){

selectedIslem=name;

document.getElementById("manual").style.display="none";

}

/* DIGER */

function showManual(el){

selectedIslem="";

document.getElementById("manual").style.display="block";

}

/* SAVE */

function save(){

let code=document.getElementById("code").value;

let device=document.getElementById("device").value;

let manual=document.getElementById("manual").value;

let finalIslem = selectedIslem || manual;

if(code.length!=6){

alert("Kod 6 haneli olmalı");

return;

}

if(!device){

alert("Cihaz gir");

return;

}

if(!selectedUsta){

alert("Usta seç");

return;

}

if(!finalIslem){

alert("İşlem gir");

return;

}

let data={

id:Date.now(),

code:code,

device:device,

proc:finalIslem,

usta:selectedUsta,

date:new Date().toLocaleString("tr-TR")

};

db.unshift(data);

localStorage.setItem("profix_db",JSON.stringify(db));

alert("Kayıt başarılı");

document.getElementById("code").value="";
document.getElementById("device").value="";
document.getElementById("manual").value="";

}

/* RENDER */

function render(){

let term=document.getElementById("search").value?.toLowerCase() || "";

let list=document.getElementById("list");

list.innerHTML="";

db.filter(x=>

x.code.includes(term) ||

x.device.toLowerCase().includes(term) ||

x.usta.toLowerCase().includes(term)

).forEach(item=>{

let div=document.createElement("div");

div.className="record";

div.innerHTML=`

<b>#${item.code}</b><br>

${item.device}<br>

${item.proc}<br>

${item.usta}<br>

${item.date}

<div class="actions">

<button class="del" onclick="del(${item.id})">Sil</button>

</div>

`;

list.appendChild(div);

});

}

/* DELETE */

function del(id){

db=db.filter(x=>x.id!==id);

localStorage.setItem("profix_db",JSON.stringify(db));

render();

}

</script>

</body>
</html>
