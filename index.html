<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>NEON EVOLUTION - PARKOUR</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Orbitron', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #wrap { position: relative; border: 5px solid #222; }
        canvas { background: #050505; display: block; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.9); z-index: 100; }
        .stats { position: absolute; top: 15px; width: 100%; display: flex; justify-content: space-around; font-size: 20px; z-index: 50; text-shadow: 0 0 10px #fff; }
        button { padding: 15px 40px; font-size: 20px; background: none; border: 2px solid #0ff; color: #0ff; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        button:hover { background: #0ff; color: #000; box-shadow: 0 0 30px #0ff; }
        .hidden { display: none !important; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body>

<div id="wrap">
    <div class="stats" id="in-game-stats">
        <div style="color: #0ff;">LEVEL: <span id="lvl">1</span></div>
        <div style="color: #0f0;">EVRİM: <span id="evo-status">BAŞLANGIÇ</span></div>
        <div style="color: #f00;">SÜRE: <span id="time">60</span></div>
    </div>

    <div id="ui">
        <h1 style="font-size: 50px; color: #0ff; text-shadow: 0 0 20px #0ff;">NEON EVOLUTION</h1>
        <p>Ateş (Kırmızı) Maviye Zarar Verir | Su (Mavi) Pembeye Zarar Verir</p>
        <p style="color: #0f0;">Asit (Yeşil) Herkesi Öldürür!</p>
        <button onclick="start()">MÜCADELEYE BAŞLA</button>
    </div>

    <canvas id="c"></canvas>
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = 1000; canvas.height = 600;

let level = 1;
let timeLeft = 60;
let active = false;
let timer;

const keys = {};
window.onkeydown = (e) => keys[e.code] = true;
window.onkeyup = (e) => keys[e.code] = false;

class Player {
    constructor(x, y, color, controls, targetX, type) {
        this.startX = x; this.startY = y;
        this.x = x; this.y = y;
        this.w = 25; this.h = 25;
        this.color = color;
        this.controls = controls;
        this.targetX = targetX;
        this.type = type; // 'water' or 'fire'
        this.vx = 0; this.vy = 0;
        this.onG = false;
        this.finished = false;
    }

    draw() {
        ctx.save();
        let s = (level - 1) * 5; // Level arttıkça büyüme
        
        // Gelişmiş Görsel Efektler (Level'a göre karakter değişiyor)
        ctx.shadowBlur = 10 + (level * 8);
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;

        if(level >= 1) { // 1. Evre: Kare
            ctx.fillRect(this.x - s/2, this.y - s/2, this.w + s, this.h + s);
        }
        if(level >= 2) { // 2. Evre: İç çekirdek
            ctx.fillStyle = "#fff";
            ctx.fillRect(this.x + 5, this.y + 5, 5 + s/2, 5 + s/2);
        }
        if(level >= 3) { // 3. Evre: Kanatlar/Çizgiler
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 3;
            ctx.strokeRect(this.x - 10 - s, this.y - 10 - s, this.w + 20 + s*2, this.h + 20 + s*2);
        }
        if(level >= 5) { // 5. Evre: Tanrı Modu Parlama
             ctx.shadowBlur = 50;
        }
        ctx.restore();
    }

    update(plats, hazards) {
        if (keys[this.controls.l]) this.vx = -6;
        else if (keys[this.controls.r]) this.vx = 6;
        else this.vx = 0;

        if (keys[this.controls.u] && this.onG) { this.vy = -14; this.onG = false; }

        this.vy += 0.8;
        this.x += this.vx; this.y += this.vy;

        this.onG = false;
        plats.forEach(p => {
            if (this.x < p.x + p.w && this.x + this.w > p.x && this.y + this.h > p.y && this.y < p.y + p.h) {
                if (this.vy > 0 && this.y + this.h - this.vy <= p.y) {
                    this.y = p.y - this.h; this.vy = 0; this.onG = true;
                }
            }
        });

        hazards.forEach(h => {
            if (this.x < h.x + h.w && this.x + this.w > h.x && this.y < h.y + h.h && this.y + this.h > h.y) {
                if (h.type === 'acid') this.reset();
                if (h.type === 'fire' && this.type === 'water') this.reset();
                if (h.type === 'water' && this.type === 'fire') this.reset();
            }
        });

        if (this.y < 120 && Math.abs(this.x - this.targetX) < 50) this.finished = true;
        else this.finished = false;

        if (this.y > canvas.height) this.reset();
    }

    reset() { this.x = this.startX; this.y = this.startY; this.vx = 0; this.vy = 0; }
}

let p1 = new Player(50, 520, "#00fbff", {u:'KeyW', l:'KeyA', r:'KeyD'}, 900, 'water');
let p2 = new Player(120, 520, "#ff00aa", {u:'ArrowUp', l:'ArrowLeft', r:'ArrowRight'}, 50, 'fire');

let platforms = [];
let hazards = [];

function buildLevel(n) {
    p1.reset(); p2.reset();
    timeLeft = 65 - (n * 5);
    document.getElementById("lvl").innerText = n;
    const evoNames = ["BAŞLANGIÇ", "PARLAYAN", "KANATLI", "USTA", "NEON TANRISI"];
    document.getElementById("evo-status").innerText = evoNames[n-1];

    platforms = [
        {x: 0, y: 570, w: 1000, h: 30}, // Zemin
        {x: 200, y: 480, w: 150 - n*10, h: 10},
        {x: 450, y: 400, w: 150 - n*10, h: 10},
        {x: 750, y: 320, w: 150 - n*10, h: 10},
        {x: 400, y: 240, w: 200 - n*10, h: 10},
        {x: 50, y: 150, w: 150, h: 10}, // P2 Kapı platformu
        {x: 850, y: 150, w: 150, h: 10}  // P1 Kapı platformu
    ];

    hazards = [
        {x: 350, y: 560, w: 100, h: 15, type: 'fire', color: '#ff4400'},
        {x: 600, y: 560, w: 100, h: 15, type: 'water', color: '#0044ff'},
        {x: 450, y: 230, w: 50, h: 10, type: 'acid', color: '#00ff44'}
    ];
    
    // Seviye arttıkça daha fazla engel
    if(n > 2) hazards.push({x: 100, y: 560, w: 150, h: 15, type: 'acid', color: '#0f0'});
}

function start() {
    document.getElementById("ui").classList.add("hidden");
    active = true; level = 1; buildLevel(1);
    if(timer) clearInterval(timer);
    timer = setInterval(() => {
        if(active) {
            timeLeft--; document.getElementById("time").innerText = timeLeft;
            if(timeLeft <= 0) { alert("SÜRE DOLDU!"); location.reload(); }
        }
    }, 1000);
    loop();
}

function loop() {
    if(!active) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Kapıları Çiz
    ctx.lineWidth = 5;
    ctx.strokeStyle = p1.color; ctx.strokeRect(910, 70, 50, 80); // P1 Kapı
    ctx.strokeStyle = p2.color; ctx.strokeRect(40, 70, 50, 80);  // P2 Kapı

    // Platformlar
    ctx.fillStyle = "#222";
    platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = "#444"; ctx.strokeRect(p.x, p.y, p.w, p.h);
    });

    // Tehlikeler
    hazards.forEach(h => {
        ctx.shadowBlur = 15; ctx.shadowColor = h.color;
        ctx.fillStyle = h.color;
        ctx.fillRect(h.x, h.y, h.w, h.h);
        ctx.shadowBlur = 0;
    });

    p1.update(platforms, hazards); p1.draw();
    p2.update(platforms, hazards); p2.draw();

    if (p1.finished && p2.finished) {
        if (level < 5) { level++; buildLevel(level); }
        else { active = false; alert("TEBRİKLER! TÜM EVRİMLER TAMAMLANDI VE KAZANDINIZ!"); location.reload(); }
    }
    requestAnimationFrame(loop);
}
</script>
</body>
</html>4
