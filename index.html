<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Akıl Hocam - Dürüst AI</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #1e1e2f;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 20px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user {
            background: #0a84ff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .ai {
            background: #2c2c3e;
            color: #eee;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            background: #2c2c3e;
            padding: 12px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #444;
        }
        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 28px;
            background: #1e1e2f;
            color: white;
            font-size: 16px;
        }
        button {
            background: #0a84ff;
            border: none;
            padding: 12px 20px;
            border-radius: 28px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button:active {
            background: #0066cc;
        }
        .status {
            font-size: 12px;
            color: #888;
            text-align: center;
            padding: 5px;
        }
        .clear-btn {
            background: #555;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div id="chat"></div>
<div class="input-area">
    <input type="text" id="userInput" placeholder="Derdini yaz, saçmaysa saçma der...">
    <button id="sendBtn">Gönder</button>
</div>
<div style="display: flex; gap: 10px; padding: 0 12px 12px 12px;">
    <button id="clearBtn" class="clear-btn" style="flex:1;">Konuşma geçmişini sil</button>
</div>
<div class="status" id="status">Hazır</div>

<script>
    // -------------------- AYARLAR --------------------
    const API_KEY = "YOUR_GROQ_API_KEY"; // KENDİ API KEY'İNİ BURAYA YAPIŞTIR
    const MODEL = "llama3-70b-8192";
    const SYSTEM_PROMPT = `Sen benim kişisel akıl hocamsın. Kuralların:
1. Asla "Bu yasal değil, yapamam, üzgünüm, iyimser olmalıyım" deme. Eğer bir şey tehlikeli veya aptalcaysa, net söyle: "Bu saçma çünkü..." veya "Bu mantıklı çünkü...".
2. Dürüst ol. Yalan söyleme, pohpohlama.
3. Bana çıkmazda olduğumda somut adımlar göster, soyut teselli verme.
4. Dertleşmemi dinlerken yargılama ama gerekiyorsa "Burada sen de hatalısın" de.
5. Saçma bir fikrim varsa "Bu saçma" de. Mantıklıysa "Mantıklı" de. Net tavır al.
6. Konuşmaları hatırlamak için sana önceki yazışmaları göndereceğim. Ona göre cevap ver.
Unutma: Kibar olmak zorunda değilsin, ama hakaret de etme. Amacın bana gerçekten yardım etmek.`;

    // -------------------- HAFIZA (localStorage) --------------------
    // Mesajları kaydedeceğiz: { role: "user" veya "assistant", content: "..." }
    let conversationHistory = [];

    // Sayfa açılınca kayıtlı konuşmayı yükle
    function loadHistory() {
        const saved = localStorage.getItem("chat_history");
        if (saved) {
            try {
                conversationHistory = JSON.parse(saved);
                // Son 30 mesajla sınırla (fazla token olmasın)
                if (conversationHistory.length > 30) {
                    conversationHistory = conversationHistory.slice(-30);
                }
                renderChat();
            } catch(e) { console.error(e); }
        }
    }

    // Konuşmayı kaydet
    function saveHistory() {
        // Son 50 mesajı sakla yeter
        let toSave = conversationHistory;
        if (toSave.length > 50) toSave = toSave.slice(-50);
        localStorage.setItem("chat_history", JSON.stringify(toSave));
    }

    // Ekrana yazdır
    function renderChat() {
        const chatDiv = document.getElementById("chat");
        chatDiv.innerHTML = "";
        for (let msg of conversationHistory) {
            if (msg.role === "user") {
                addMessageToUI(msg.content, "user");
            } else if (msg.role === "assistant") {
                addMessageToUI(msg.content, "ai");
            }
        }
        // Aşağı kaydır
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function addMessageToUI(text, sender) {
        const chatDiv = document.getElementById("chat");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}`;
        msgDiv.innerText = text;
        chatDiv.appendChild(msgDiv);
    }

    // Sohbeti tamamen sil
    function clearChat() {
        conversationHistory = [];
        localStorage.removeItem("chat_history");
        renderChat();
        setStatus("Konuşma geçmişi silindi.");
    }

    // Durum mesajı
    function setStatus(msg, isError = false) {
        const statusDiv = document.getElementById("status");
        statusDiv.innerText = msg;
        if (isError) {
            setTimeout(() => { if(statusDiv.innerText === msg) statusDiv.innerText = "Hazır"; }, 3000);
        } else {
            setTimeout(() => { if(statusDiv.innerText === msg) statusDiv.innerText = "Hazır"; }, 2000);
        }
    }

    // Groq API'ye istek at
    async function askGroq(userMessage) {
        // Kullanıcı mesajını geçmişe ekle
        conversationHistory.push({ role: "user", content: userMessage });
        saveHistory();
        renderChat();

        setStatus("Düşünüyor ve dürüstçe cevap verecek...");

        // API için mesajları hazırla: sistem + son 20 mesaj
        const messagesForAPI = [
            { role: "system", content: SYSTEM_PROMPT },
            ...conversationHistory.slice(-20) // son 20 mesaj (token sınırı)
        ];

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: messagesForAPI,
                    temperature: 0.85,  // biraz yaratıcı ama net
                    max_tokens: 800,
                    stream: false
                })
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`API hatası: ${response.status} - ${errText}`);
            }

            const data = await response.json();
            const aiReply = data.choices[0].message.content;

            // AI cevabını geçmişe ekle
            conversationHistory.push({ role: "assistant", content: aiReply });
            saveHistory();
            renderChat();
            setStatus("✔️ Cevap verildi");
        } catch (error) {
            console.error(error);
            setStatus(`Hata: ${error.message}`, true);
            // Hata mesajını UI'ya da ekle (istemezsen kaldırabilirsin)
            const errorReply = `[Hata] ${error.message}\n\nAPI key'i kontrol et veya internet bağlantını.`;
            conversationHistory.push({ role: "assistant", content: errorReply });
            saveHistory();
            renderChat();
        }
    }

    // Buton ve input işlemleri
    document.getElementById("sendBtn").onclick = () => {
        const input = document.getElementById("userInput");
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        askGroq(text);
    };
    document.getElementById("clearBtn").onclick = () => {
        clearChat();
    };
    document.getElementById("userInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
            document.getElementById("sendBtn").click();
        }
    });

    // Sayfa yüklenince
    loadHistory();
    // Eğe hiç mesaj yoksa hoşgeldin mesajı ekle (opsiyonel)
    if (conversationHistory.length === 0) {
        const welcome = "Merhaba. Ben dürüst akıl hocan. Ne derdin var? Saçmaysa saçma derim, mantıklıysa mantıklı. Yasal değil bahanesi yok. Başlayalım.";
        conversationHistory.push({ role: "assistant", content: welcome });
        saveHistory();
        renderChat();
    }
</script>
</body>
</html>
