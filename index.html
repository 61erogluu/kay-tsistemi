<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PRO-FIX | Gelişmiş Servis Takip</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0c;
            color: #ffffff;
            min-height: 100vh;
            background: linear-gradient(145deg, #0a0a0c 0%, #1a1a1f 100%);
        }

        /* Modern Header */
        .header {
            background: rgba(22, 22, 26, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            font-size: 28px;
            color: #0a84ff;
            filter: drop-shadow(0 0 10px rgba(10, 132, 255, 0.5));
        }

        .logo h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a8a8a8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu-btn {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .menu-btn:active {
            background: rgba(10, 132, 255, 0.2);
            transform: scale(0.95);
        }

        /* Main Container */
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Card Tasarımı */
        .card {
            background: rgba(28, 28, 33, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8e8e93;
        }

        .section-title i {
            font-size: 16px;
            color: #0a84ff;
        }

        /* Form Elemanları */
        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #98989d;
            margin-bottom: 6px;
            margin-left: 4px;
        }

        input, select, textarea {
            width: 100%;
            padding: 16px;
            background: #1c1c1f;
            border: 1.5px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0a84ff;
            background: #23232a;
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.1);
        }

        /* Modern Butonlar */
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 18px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #0a84ff;
            color: white;
            box-shadow: 0 10px 20px rgba(10, 132, 255, 0.3);
            margin: 8px 0;
        }

        .btn:active {
            transform: scale(0.98);
            box-shadow: 0 5px 10px rgba(10, 132, 255, 0.2);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-danger {
            background: #ff453a;
            box-shadow: 0 10px 20px rgba(255, 69, 58, 0.2);
        }

        /* İstatistik Kartları */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(28, 28, 33, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #0a84ff;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 13px;
            color: #8e8e93;
        }

        /* Grafik */
        .chart-container {
            background: rgba(28, 28, 33, 0.3);
            border-radius: 20px;
            padding: 15px;
            margin-top: 20px;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: #16161a;
            z-index: 1000;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px;
            overflow-y: auto;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .close-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            cursor: pointer;
        }

        /* Kayıt Kartları */
        .record-card {
            background: #1c1c1f;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .record-code {
            font-size: 18px;
            font-weight: 700;
            color: #0a84ff;
            letter-spacing: 1px;
        }

        .record-badge {
            padding: 6px 12px;
            background: rgba(10, 132, 255, 0.1);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #0a84ff;
        }

        .record-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 12px 0;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 12px;
        }

        .detail-item i {
            font-size: 14px;
            color: #0a84ff;
        }

        .detail-item span {
            font-size: 11px;
            color: #8e8e93;
        }

        .record-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .edit-btn {
            background: rgba(10, 132, 255, 0.1);
            color: #0a84ff;
        }

        .delete-btn {
            background: rgba(255, 69, 58, 0.1);
            color: #ff453a;
        }

        .edit-btn:active, .delete-btn:active {
            transform: scale(0.95);
        }

        /* Arama Kutusu */
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #8e8e93;
        }

        .search-box input {
            padding-left: 48px;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 999;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .overlay.active {
            display: block;
            opacity: 1;
        }

        /* Toast Bildirimi */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            max-width: 350px;
            margin: 0 auto;
            background: #2c2c2e;
            color: white;
            padding: 16px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 2000;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast i {
            font-size: 24px;
            color: #32d74b;
        }

        /* Responsive */
        @media (max-width: 380px) {
            .record-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="logo">
        <i class="fas fa-tools"></i>
        <h1>PRO-FIX Gelişmiş</h1>
    </div>
    <div class="menu-btn" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </div>
</div>

<!-- Ana İçerik -->
<div class="container">
    <!-- İstatistik Kartları -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="totalCount">0</div>
            <div class="stat-label">Toplam Tamir</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="todayCount">0</div>
            <div class="stat-label">Bugün</div>
        </div>
    </div>

    <!-- Kayıt Formu -->
    <div class="card">
        <div class="section-title">
            <i class="fas fa-plus-circle"></i>
            <span>YENİ KAYIT / DÜZENLE</span>
        </div>

        <div class="input-group">
            <label><i class="fas fa-mobile-alt" style="margin-right: 6px;"></i> Model / Cihaz</label>
            <input type="text" id="device" placeholder="Örn: iPhone 14 Pro Max" autocomplete="off">
        </div>

        <div class="input-group">
            <label><i class="fas fa-qrcode"></i> Servis Kodu / Seri No</label>
            <input type="text" id="code" placeholder="Örn: SER-2024-001" autocomplete="off">
        </div>

        <div class="input-group">
            <label><i class="fas fa-user-cog"></i> Usta</label>
            <select id="usta">
                <option value="" disabled selected>Usta seçin</option>
                <option value="Kadir">👨‍🔧 Kadir Usta</option>
                <option value="Mehmet">👨‍🔧 Mehmet Usta</option>
                <option value="Ahmet">👨‍🔧 Ahmet Usta</option>
            </select>
        </div>

        <div class="input-group">
            <label><i class="fas fa-wrench"></i> İşlem</label>
            <select id="islem">
                <option value="" disabled selected>İşlem seçin</option>
                <option value="BGA Değişim">🔧 BGA Değişim</option>
                <option value="EMMC">💾 EMMC Tamiri</option>
                <option value="Şarj Soketi">🔌 Şarj Soketi</option>
                <option value="Batarya">🔋 Batarya Değişim</option>
                <option value="Ekran">📱 Ekran Değişim</option>
            </select>
        </div>

        <div class="input-group">
            <label><i class="fas fa-sticky-note"></i> Notlar</label>
            <textarea id="notes" rows="2" placeholder="Ek notlar (opsiyonel)"></textarea>
        </div>

        <button class="btn" onclick="saveData()">
            <i class="fas fa-save"></i>
            Kaydet
        </button>
        <button class="btn btn-secondary" onclick="clearForm()" style="margin-top: 0;">
            <i class="fas fa-undo-alt"></i>
            Temizle
        </button>
    </div>

    <!-- Grafik Kartı -->
    <div class="card">
        <div class="section-title">
            <i class="fas fa-chart-bar"></i>
            <span>USTA PERFORMANS</span>
        </div>
        <div class="chart-container">
            <canvas id="chart" style="width: 100%; height: 200px;"></canvas>
        </div>
    </div>

    <!-- Yedekleme Kartı -->
    <div class="card">
        <div class="section-title">
            <i class="fas fa-database"></i>
            <span>YEDEKLEME & GERİ YÜKLEME</span>
        </div>
        
        <button class="btn btn-secondary" onclick="exportData()">
            <i class="fas fa-download"></i>
            Dışa Aktar (JSON)
        </button>
        
        <div style="position: relative; margin-top: 8px;">
            <input type="file" id="importFile" accept=".json" onchange="importData(event)" style="opacity: 0; position: absolute; width: 100%; height: 100%; cursor: pointer;">
            <button class="btn btn-secondary" style="pointer-events: none;">
                <i class="fas fa-upload"></i>
                İçe Aktar
            </button>
        </div>
    </div>
</div>

<!-- Sidebar (Kayıt Listesi) -->
<div id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <h3 style="font-size: 20px;">📋 Kayıtlı Servisler</h3>
        <div class="close-btn" onclick="toggleSidebar()">
            <i class="fas fa-times"></i>
        </div>
    </div>

    <!-- Arama -->
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="search" placeholder="Ara: kod, cihaz, usta..." onkeyup="renderRecords()">
    </div>

    <!-- Filtreler -->
    <div style="display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding: 4px 0;">
        <button class="btn-secondary" style="padding: 8px 16px; font-size: 13px;" onclick="filterRecords('all')">Tümü</button>
        <button class="btn-secondary" style="padding: 8px 16px; font-size: 13px;" onclick="filterRecords('Kadir')">Kadir</button>
        <button class="btn-secondary" style="padding: 8px 16px; font-size: 13px;" onclick="filterRecords('Mehmet')">Mehmet</button>
        <button class="btn-secondary" style="padding: 8px 16px; font-size: 13px;" onclick="filterRecords('Ahmet')">Ahmet</button>
    </div>

    <!-- Kayıt Listesi -->
    <div id="records" style="padding-bottom: 30px;"></div>
</div>

<!-- Overlay -->
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

<!-- Toast Bildirimi -->
<div id="toast" class="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastMessage">İşlem başarılı</span>
</div>

<script>
// Veritabanı
let db = JSON.parse(localStorage.getItem('profix_advanced')) || [];
let editingId = null;
let chart = null;
let currentFilter = 'all';

// Toast göster
function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');
    const icon = toast.querySelector('i');
    
    toastMessage.textContent = message;
    
    if (type === 'success') {
        icon.style.color = '#32d74b';
        icon.className = 'fas fa-check-circle';
    } else if (type === 'error') {
        icon.style.color = '#ff453a';
        icon.className = 'fas fa-exclamation-circle';
    }
    
    toast.classList.add('show');
    
    setTimeout(() => {
        toast.classList.remove('show');
    }, 3000);
}

// Sidebar toggle
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('active');
}

// Form temizle
function clearForm() {
    document.getElementById('device').value = '';
    document.getElementById('code').value = '';
    document.getElementById('usta').value = '';
    document.getElementById('islem').value = '';
    document.getElementById('notes').value = '';
    editingId = null;
    showToast('Form temizlendi');
}

// Filtreleme
function filterRecords(usta) {
    currentFilter = usta;
    renderRecords();
}

// İstatistikleri güncelle
function updateStats() {
    const total = db.length;
    const today = db.filter(r => {
        const todayDate = new Date().toLocaleDateString();
        return r.date && r.date.includes(todayDate);
    }).length;
    
    document.getElementById('totalCount').textContent = total;
    document.getElementById('todayCount').textContent = today;
}

// Veri kaydet
function saveData() {
    let device = document.getElementById('device').value.trim();
    let code = document.getElementById('code').value.trim();
    let usta = document.getElementById('usta').value;
    let islem = document.getElementById('islem').value;
    let notes = document.getElementById('notes').value.trim();
    
    if (!device || !code || !usta || !islem) {
        showToast('Lütfen tüm zorunlu alanları doldurun!', 'error');
        return;
    }
    
    const now = new Date();
    const formattedDate = now.toLocaleDateString('tr-TR') + ' ' + now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    
    if (editingId) {
        let index = db.findIndex(r => r.id === editingId);
        if (index !== -1) {
            db[index] = {
                ...db[index],
                device,
                code,
                usta,
                islem,
                notes,
                date: formattedDate
            };
            showToast('Kayıt güncellendi');
        }
        editingId = null;
    } else {
        db.unshift({
            id: Date.now(),
            device,
            code,
            usta,
            islem,
            notes,
            date: formattedDate
        });
        showToast('Yeni kayıt eklendi');
    }
    
    // Verileri kaydet
    localStorage.setItem('profix_advanced', JSON.stringify(db));
    
    // UI'ı güncelle
    renderRecords();
    updateChart();
    updateStats();
    clearForm();
    
    // Sidebar'ı kapat
    if (window.innerWidth < 768) {
        toggleSidebar();
    }
}

// Düzenle
function editRecord(id) {
    let rec = db.find(r => r.id === id);
    if (!rec) return;
    
    document.getElementById('device').value = rec.device;
    document.getElementById('code').value = rec.code;
    document.getElementById('usta').value = rec.usta;
    document.getElementById('islem').value = rec.islem;
    document.getElementById('notes').value = rec.notes || '';
    
    editingId = id;
    
    toggleSidebar();
    showToast('Düzenleme modu aktif');
    
    // Sayfayı yukarı kaydır
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Sil
function deleteRecord(id) {
    if (confirm('Bu kaydı silmek istediğinize emin misiniz?')) {
        db = db.filter(r => r.id !== id);
        localStorage.setItem('profix_advanced', JSON.stringify(db));
        renderRecords();
        updateChart();
        updateStats();
        showToast('Kayıt silindi');
    }
}

// Kayıtları listele
function renderRecords() {
    let term = document.getElementById('search').value.toLowerCase();
    let container = document.getElementById('records');
    
    let filteredDb = db.filter(r => {
        const matchesSearch = r.device.toLowerCase().includes(term) || 
                              r.code.toLowerCase().includes(term) || 
                              r.usta.toLowerCase().includes(term) ||
                              (r.islem && r.islem.toLowerCase().includes(term));
        
        const matchesFilter = currentFilter === 'all' || r.usta === currentFilter;
        
        return matchesSearch && matchesFilter;
    });
    
    if (filteredDb.length === 0) {
        container.innerHTML = `
            <div style="text-align: center; padding: 40px 20px; background: rgba(255,255,255,0.02); border-radius: 20px;">
                <i class="fas fa-inbox" style="font-size: 48px; color: #8e8e93; margin-bottom: 16px;"></i>
                <p style="color: #8e8e93;">Kayıt bulunamadı</p>
            </div>
        `;
        return;
    }
    
    container.innerHTML = '';
    filteredDb.forEach(r => {
        let div = document.createElement('div');
        div.className = 'record-card';
        
        div.innerHTML = `
            <div class="record-header">
                <span class="record-code">${r.code}</span>
                <span class="record-badge">${r.islem}</span>
            </div>
            <div style="font-size: 16px; font-weight: 600; margin-bottom: 8px;">${r.device}</div>
            <div class="record-details">
                <div class="detail-item">
                    <i class="fas fa-user"></i>
                    <span>Usta</span>
                    <span style="font-weight: 600;">${r.usta}</span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-calendar"></i>
                    <span>Tarih</span>
                    <span style="font-weight: 600; font-size: 10px;">${r.date}</span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-sticky-note"></i>
                    <span>Not</span>
                    <span style="font-weight: 600;">${r.notes || '-'}</span>
                </div>
            </div>
            <div class="record-actions">
                <button class="action-btn edit-btn" onclick="editRecord(${r.id})">
                    <i class="fas fa-edit"></i> Düzenle
                </button>
                <button class="action-btn delete-btn" onclick="deleteRecord(${r.id})">
                    <i class="fas fa-trash"></i> Sil
                </button>
            </div>
        `;
        container.appendChild(div);
    });
}

// Grafik güncelle
function updateChart() {
    const ctx = document.getElementById('chart').getContext('2d');
    
    let ustaCounts = {
        'Kadir': 0,
        'Mehmet': 0,
        'Ahmet': 0
    };
    
    db.forEach(r => {
        if (ustaCounts.hasOwnProperty(r.usta)) {
            ustaCounts[r.usta]++;
        }
    });
    
    let labels = Object.keys(ustaCounts);
    let data = Object.values(ustaCounts);
    
    if (chart) chart.destroy();
    
    chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels,
            datasets: [{
                label: 'Tamir Sayısı',
                data,
                backgroundColor: [
                    'rgba(10, 132, 255, 0.8)',
                    'rgba(50, 215, 75, 0.8)',
                    'rgba(255, 149, 0, 0.8)'
                ],
                borderRadius: 8,
                barPercentage: 0.6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    grid: { color: 'rgba(255,255,255,0.05)' },
                    ticks: { color: '#8e8e93' }
                },
                x: {
                    grid: { display: false },
                    ticks: { color: '#8e8e93' }
                }
            }
        }
    });
}

// Dışa aktar
function exportData() {
    const dataStr = JSON.stringify(db, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `profix_yedek_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    showToast('Yedekleme dosyası indiriliyor');
}

// İçe aktar
function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const imported = JSON.parse(e.target.result);
            
            if (Array.isArray(imported)) {
                // Mevcut verilerle birleştir (tekrarları önle)
                const newIds = new Set(imported.map(item => item.id));
                const filteredDb = db.filter(item => !newIds.has(item.id));
                db = [...imported, ...filteredDb];
                
                // Tarihe göre sırala
                db.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                localStorage.setItem('profix_advanced', JSON.stringify(db));
                renderRecords();
                updateChart();
                updateStats();
                showToast(`${imported.length} kayıt içe aktarıldı`);
            } else {
                showToast('Geçersiz dosya formatı!', 'error');
            }
        } catch(err) {
            showToast('Dosya okunamadı!', 'error');
        }
    };
    reader.readAsText(file);
    
    // Input'u temizle
    event.target.value = '';
}

// Klavye kısayolu (Esc ile sidebar'ı kapat)
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        const sidebar = document.getElementById('sidebar');
        if (sidebar.classList.contains('open')) {
            toggleSidebar();
        }
    }
});

// Sayfa yüklendiğinde
document.addEventListener('DOMContentLoaded', function() {
    renderRecords();
    updateChart();
    updateStats();
    
    // Input'lara enter tuşu desteği
    const inputs = document.querySelectorAll('input, select');
    inputs.forEach(input => {
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                saveData();
            }
        });
    });
});
</script>
