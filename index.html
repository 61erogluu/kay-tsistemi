<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRO-FIX | Servis Takip</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0a0a0c;
            color: white;
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #16161a;
            padding: 15px;
            border-radius: 20px;
        }
        .header h1 {
            font-size: 22px;
            color: #0a84ff;
        }
        .menu-btn {
            font-size: 24px;
            background: #1c1c1f;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            cursor: pointer;
        }
        .status {
            background: #1c1c1f;
            padding: 10px 15px;
            border-radius: 30px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 10px;
            background: #ff453a;
        }
        .status-dot.online {
            background: #32d74b;
        }
        .card {
            background: #16161a;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }
        input, select, textarea {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            background: #1c1c1f;
            border: 1px solid #333;
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 16px;
            background: #0a84ff;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            margin: 5px 0;
            cursor: pointer;
        }
        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: #1c1c1f;
            flex: 1;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }
        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #0a84ff;
        }
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 90%;
            max-width: 350px;
            height: 100vh;
            background: #16161a;
            z-index: 1000;
            transition: 0.3s;
            padding: 20px;
            overflow-y: auto;
        }
        .sidebar.open {
            right: 0;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .close-btn {
            font-size: 24px;
            cursor: pointer;
        }
        .record {
            background: #1c1c1f;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .record-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .record-code {
            color: #0a84ff;
            font-weight: bold;
            font-size: 16px;
        }
        .record-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .edit-btn, .delete-btn {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
        }
        .edit-btn {
            background: rgba(10, 132, 255, 0.2);
            color: #0a84ff;
        }
        .delete-btn {
            background: rgba(255, 69, 58, 0.2);
            color: #ff453a;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            display: none;
        }
        .overlay.active {
            display: block;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #2c2c2e;
            padding: 15px 20px;
            border-radius: 30px;
            text-align: center;
            transform: translateY(100px);
            transition: 0.3s;
            z-index: 2000;
        }
        .toast.show {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="header">
    <h1>PRO-FIX</h1>
    <div class="menu-btn" onclick="toggleSidebar()">☰</div>
</div>

<!-- Durum Göstergesi -->
<div class="status" id="status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Bağlantı kontrol ediliyor...</span>
</div>

<!-- İstatistikler -->
<div class="stats">
    <div class="stat-box">
        <div class="stat-number" id="totalCount">0</div>
        <div>Toplam</div>
    </div>
    <div class="stat-box">
        <div class="stat-number" id="todayCount">0</div>
        <div>Bugün</div>
    </div>
</div>

<!-- Kayıt Formu -->
<div class="card">
    <h3 style="margin-bottom: 15px;">Yeni Kayıt</h3>
    
    <input type="text" id="device" placeholder="Cihaz Modeli">
    <input type="text" id="code" placeholder="Servis Kodu">
    
    <select id="usta">
        <option value="">Usta Seç</option>
        <option value="Kadir">Kadir Usta</option>
        <option value="Mehmet">Mehmet Usta</option>
    </select>
    
    <select id="islem">
        <option value="">İşlem Seç</option>
        <option value="BGA Değişim">BGA Değişim</option>
        <option value="EMMC Değişim">EMMC Değişim</option>
    </select>
    
    <textarea id="notes" rows="2" placeholder="Not (opsiyonel)"></textarea>
    
    <button onclick="saveData()">💾 Buluta Kaydet</button>
    <button onclick="clearForm()" style="background: #333;">Temizle</button>
</div>

<!-- Sidebar -->
<div id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <h3>Kayıtlar</h3>
        <div class="close-btn" onclick="toggleSidebar()">✕</div>
    </div>
    
    <input type="text" id="search" placeholder="Ara..." onkeyup="renderRecords()" style="margin-bottom: 15px;">
    
    <div style="display: flex; gap: 5px; margin-bottom: 15px;">
        <button onclick="filterRecords('all')" style="flex:1; padding:8px;">Tümü</button>
        <button onclick="filterRecords('Kadir')" style="flex:1; padding:8px;">Kadir</button>
        <button onclick="filterRecords('Mehmet')" style="flex:1; padding:8px;">Mehmet</button>
    </div>
    
    <div id="records"></div>
</div>

<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>
<div id="toast" class="toast">İşlem başarılı</div>

<script>
// ===========================================
// FIREBASE - SENİN AYARLARIN
// ===========================================
const firebaseConfig = {
    apiKey: "AIzaSyBQSINTtuBwuzZrvrtGQSHSB7BYGDHglz8",
    authDomain: "emmc-84368.firebaseapp.com",
    databaseURL: "https://emmc-84368-default-rtdb.firebaseio.com",
    projectId: "emmc-84368",
    storageBucket: "emmc-84368.firebasestorage.app",
    messagingSenderId: "876650784012",
    appId: "1:876650784012:web:1bfd1e383f2ef4523fd529"
};

// Firebase Başlat
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// ===========================================
// DEĞİŞKENLER
// ===========================================
let db = [];
let editingId = null;
let currentFilter = 'all';

// ===========================================
// BAĞLANTI KONTROLÜ
// ===========================================
function checkConnection() {
    const connectedRef = database.ref('.info/connected');
    connectedRef.on('value', (snap) => {
        if (snap.val() === true) {
            document.getElementById('statusDot').className = 'status-dot online';
            document.getElementById('statusText').innerText = 'Buluta Bağlandı ✓';
            loadData();
        } else {
            document.getElementById('statusDot').className = 'status-dot';
            document.getElementById('statusText').innerText = 'Bağlantı yok ✗';
        }
    });
}

// ===========================================
// VERİ YÜKLE
// ===========================================
function loadData() {
    database.ref('kayitlar').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            db = Object.values(data);
            showToast('📥 Yeni kayıtlar geldi!');
        } else {
            db = [];
        }
        renderRecords();
        updateStats();
    });
}

// ===========================================
// KAYDET
// ===========================================
function saveData() {
    const device = document.getElementById('device').value.trim();
    const code = document.getElementById('code').value.trim();
    const usta = document.getElementById('usta').value;
    const islem = document.getElementById('islem').value;
    const notes = document.getElementById('notes').value.trim();
    
    if (!device || !code || !usta || !islem) {
        showToast('Tüm alanları doldur!');
        return;
    }
    
    const now = new Date();
    const date = now.toLocaleDateString('tr-TR') + ' ' + now.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
    
    const newRecord = {
        id: Date.now(),
        device,
        code,
        usta,
        islem,
        notes,
        date
    };
    
    // Firebase'e kaydet
    database.ref('kayitlar/' + newRecord.id).set(newRecord)
        .then(() => {
            showToast('☁️ Buluta kaydedildi!');
            clearForm();
        })
        .catch((error) => {
            showToast('Hata: ' + error.message);
        });
}

// ===========================================
// DİĞER FONKSİYONLAR
// ===========================================
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('active');
}

function clearForm() {
    document.getElementById('device').value = '';
    document.getElementById('code').value = '';
    document.getElementById('usta').value = '';
    document.getElementById('islem').value = '';
    document.getElementById('notes').value = '';
    editingId = null;
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}

function filterRecords(usta) {
    currentFilter = usta;
    renderRecords();
}

function updateStats() {
    document.getElementById('totalCount').innerText = db.length;
    const today = new Date().toLocaleDateString();
    const todayCount = db.filter(r => r.date && r.date.includes(today)).length;
    document.getElementById('todayCount').innerText = todayCount;
}

function renderRecords() {
    const term = document.getElementById('search').value.toLowerCase();
    const container = document.getElementById('records');
    
    let filtered = db.filter(r => {
        const matchSearch = r.device.toLowerCase().includes(term) || 
                           r.code.toLowerCase().includes(term) || 
                           r.usta.toLowerCase().includes(term);
        const matchFilter = currentFilter === 'all' || r.usta === currentFilter;
        return matchSearch && matchFilter;
    });
    
    if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:#666;">Kayıt yok</div>';
        return;
    }
    
    container.innerHTML = '';
    filtered.sort((a,b) => b.id - a.id).forEach(r => {
        container.innerHTML += `
            <div class="record">
                <div class="record-header">
                    <span class="record-code">${r.code}</span>
                    <span>${r.islem}</span>
                </div>
                <div style="font-weight:bold; margin-bottom:5px;">${r.device}</div>
                <div style="color:#888; font-size:12px; margin-bottom:5px;">${r.usta} - ${r.date}</div>
                ${r.notes ? '<div style="color:#888; font-size:12px;">📝 ' + r.notes + '</div>' : ''}
                <div class="record-actions">
                    <div class="edit-btn" onclick="editRecord(${r.id})">Düzenle</div>
                    <div class="delete-btn" onclick="deleteRecord(${r.id})">Sil</div>
                </div>
            </div>
        `;
    });
}

function editRecord(id) {
    const rec = db.find(r => r.id === id);
    if (rec) {
        document.getElementById('device').value = rec.device;
        document.getElementById('code').value = rec.code;
        document.getElementById('usta').value = rec.usta;
        document.getElementById('islem').value = rec.islem;
        document.getElementById('notes').value = rec.notes || '';
        editingId = id;
        toggleSidebar();
    }
}

function deleteRecord(id) {
    if (confirm('Silmek istediğine emin misin?')) {
        database.ref('kayitlar/' + id).remove()
            .then(() => showToast('Kayıt silindi'));
    }
}

// Başlat
checkConnection();
</script>

</body>
</html>
