<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>NOVA PRO | Kesintisiz Sesli Asistan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #0B1120 0%, #0F172A 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #E2E8F0;
        }
        .top-bar {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 1px solid #38BDF8;
        }
        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38BDF8, #818CF8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            background: rgba(255,255,255,0.08);
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            color: #E2E8F0;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: #3B82F6;
            color: white;
        }
        .mic-active {
            background: #EF4444;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1);}
            50% { opacity: 0.7; transform: scale(0.98);}
            100% { opacity: 1; transform: scale(1);}
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 24px;
            font-size: 15px;
            line-height: 1.45;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .user {
            background: #3B82F6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .ai {
            background: rgba(30, 41, 59, 0.95);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .input-area {
            background: rgba(15, 23, 42, 0.95);
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #38BDF8;
        }
        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border: none;
            border-radius: 40px;
            background: #1E293B;
            color: white;
            font-size: 15px;
        }
        .input-area input::placeholder {
            color: #94A3B8;
        }
        .status {
            font-size: 11px;
            text-align: center;
            padding: 6px;
            background: #0F172A;
            color: #94A3B8;
        }
        .history-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1E293B;
            border-radius: 24px 24px 0 0;
            max-height: 60%;
            overflow-y: auto;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s;
            z-index: 1000;
        }
        .history-panel.open {
            transform: translateY(0);
        }
        .history-item {
            padding: 12px;
            border-bottom: 1px solid #334155;
            cursor: pointer;
        }
        .history-item:active {
            background: #334155;
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0F172A;
        }
        ::-webkit-scrollbar-thumb {
            background: #3B82F6;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="top-bar">
    <div class="logo">✦ NOVA PRO</div>
    <div class="btn-group">
        <button id="newChatBtn" class="btn">+ Yeni</button>
        <button id="memoryBtn" class="btn">🧠 Bilgi Bankam</button>
        <button id="historyBtn" class="btn">📜 Geçmiş</button>
        <select id="voiceGender" class="btn">
            <option value="erkek">Erkek Ses</option>
            <option value="kadin">Kadın Ses</option>
        </select>
        <button id="micToggleBtn" class="btn btn-primary">🎤 Mikrofon Kapalı</button>
    </div>
</div>
<div id="chat"></div>
<div class="input-area">
    <input type="text" id="userInput" placeholder="Bir şey söyle...">
    <button id="sendBtn" class="btn btn-primary">Gönder</button>
</div>
<div class="status" id="status">✨ Nova hazır. Naber?</div>
<div id="historyPanel" class="history-panel">
    <h3 style="margin-bottom:12px;">📁 Sohbet Geçmişi</h3>
    <div id="historyList"></div>
    <button id="closeHistory" class="btn" style="margin-top:12px; width:100%;">Kapat</button>
</div>

<script>
    // ==================== GROQ API KEY (ENTEGRE) ====================
    const GROQ_API_KEY = "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";
    
    // ==================== KALICI HAFIZA (Sohbetten bağımsız) ====================
    let userMemory = {};
    
    function loadMemory() {
        const saved = localStorage.getItem("nova_memory");
        if (saved) {
            try { userMemory = JSON.parse(saved); } catch(e) { console.error(e); }
        }
    }
    function saveMemory() {
        localStorage.setItem("nova_memory", JSON.stringify(userMemory));
    }
    function addToMemory(key, value) {
        userMemory[key.toLowerCase()] = value;
        saveMemory();
        setStatus(`📝 Hatırladım: ${key} = ${value}`);
    }
    
    // ==================== SOHBET YÖNETİMİ ====================
    let chats = {};
    let currentChatId = null;
    
    function saveChats() {
        localStorage.setItem("nova_chats", JSON.stringify(chats));
    }
    function loadChats() {
        const saved = localStorage.getItem("nova_chats");
        if (saved) {
            try { chats = JSON.parse(saved); } catch(e) { console.error(e); }
        }
        if (Object.keys(chats).length === 0) {
            const id = Date.now().toString();
            chats[id] = { name: "Ana Sohbet", messages: [] };
            currentChatId = id;
        } else {
            currentChatId = Object.keys(chats)[0];
        }
        saveChats();
        renderCurrentChat();
    }
    function renderCurrentChat() {
        if (!currentChatId || !chats[currentChatId]) return;
        const container = document.getElementById("chat");
        container.innerHTML = "";
        for (let msg of chats[currentChatId].messages) {
            const div = document.createElement("div");
            div.className = `message ${msg.role === "user" ? "user" : "ai"}`;
            div.innerText = msg.content;
            container.appendChild(div);
        }
        container.scrollTop = container.scrollHeight;
    }
    function addMessage(role, content) {
        if (!currentChatId) return;
        chats[currentChatId].messages.push({ role, content });
        if (chats[currentChatId].messages.length > 100) {
            chats[currentChatId].messages = chats[currentChatId].messages.slice(-100);
        }
        saveChats();
        renderCurrentChat();
    }
    function newChat() {
        let name = prompt("Sohbet adı (örn: İş, Dertleşme, Proje)");
        if (!name) name = "Sohbet " + (Object.keys(chats).length + 1);
        const id = Date.now().toString();
        chats[id] = { name: name, messages: [] };
        currentChatId = id;
        saveChats();
        renderCurrentChat();
        setStatus(`"${name}" başlatıldı. Bilgi bankan ayrı korunuyor.`);
    }
    function deleteChat(id) {
        if (Object.keys(chats).length === 1) {
            setStatus("Son sohbeti silemezsin", true);
            return;
        }
        delete chats[id];
        currentChatId = Object.keys(chats)[0];
        saveChats();
        renderCurrentChat();
        setStatus("Sohbet silindi. Bilgi bankan etkilenmedi.");
    }
    function showHistory() {
        const panel = document.getElementById("historyPanel");
        const listDiv = document.getElementById("historyList");
        listDiv.innerHTML = "";
        for (let id in chats) {
            const item = document.createElement("div");
            item.className = "history-item";
            item.innerHTML = `${chats[id].name} (${chats[id].messages.length} mesaj) <button style="float:right; background:none; border:none; color:#EF4444; cursor:pointer;" onclick="event.stopPropagation(); deleteChat('${id}'); document.getElementById('historyPanel').classList.remove('open'); showHistory();">🗑</button>`;
            item.onclick = (e) => {
                if (e.target.tagName !== 'BUTTON') {
                    currentChatId = id;
                    renderCurrentChat();
                    panel.classList.remove("open");
                    setStatus(`"${chats[id].name}" açıldı`);
                }
            };
            listDiv.appendChild(item);
        }
        panel.classList.add("open");
    }
    
    // ==================== GROQ İSTEĞİ ====================
    const SYSTEM_PROMPT = `Sen benim yakın arkadaşım ve profesyonel asistanım. Adın Nova. Samimi, dürüst, gerekiyorsa "Bu saçma" de. 
    Asla "yasal değil, yapamam, üzgünüm" deme. Doğal Türkçe konuş. Kısa ve net cevap ver.
    Kullanıcının verdiği kişi ve iş bilgilerini hatırla. Sohbet geçmişini unutma.
    Kullanıcı sana bir şey sorduğunda arkadaş gibi cevap ver. "Naber?", "İyi misin?" diye sor.`;
    
    async function askGroq(userMessage, memoryInfo) {
        const fullPrompt = `${SYSTEM_PROMPT}\n\nKullanıcı hakkında hatırladıklarım: ${memoryInfo}\n\nKullanıcı: ${userMessage}\n\nNova:`;
        
        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GROQ_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "user", content: fullPrompt }],
                    temperature: 0.85,
                    max_tokens: 600
                })
            });
            
            if (!response.ok) {
                const errText = await response.text();
                if (response.status === 401) throw new Error("API key geçersiz. Lütfen kontrol et.");
                if (response.status === 429) throw new Error("Groq kotası doldu. Yarın tekrar dene.");
                throw new Error(`Groq hatası: ${response.status}`);
            }
            
            const data = await response.json();
            return data.choices[0].message.content;
        } catch(e) {
            console.error("Groq hatası:", e);
            return "Bağlantı hatası: " + e.message;
        }
    }
    
    // ==================== SESLİ GİRİŞ ====================
    let isMicActive = false;
    let recognition = null;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'tr-TR';
        recognition.continuous = true;
        recognition.interimResults = false;
    }
    
    // ==================== SESLİ ÇIKIŞ ====================
    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'tr-TR';
        utterance.rate = 0.9;
        const gender = document.getElementById("voiceGender").value;
        
        // Ses seçimi için bekle
        const setVoice = () => {
            const voices = window.speechSynthesis.getVoices();
            let selected = null;
            if (gender === "erkek") {
                selected = voices.find(v => v.lang.includes("tr") && (v.name.toLowerCase().includes("male") || v.name.toLowerCase().includes("erke")));
            } else {
                selected = voices.find(v => v.lang.includes("tr") && (v.name.toLowerCase().includes("female") || v.name.toLowerCase().includes("kadın")));
            }
            if (selected) utterance.voice = selected;
            window.speechSynthesis.speak(utterance);
        };
        
        if (window.speechSynthesis.getVoices().length) {
            setVoice();
        } else {
            window.speechSynthesis.onvoiceschanged = setVoice;
        }
        setStatus("🔊 Konuşuyor...");
        utterance.onend = () => setStatus("Hazır");
    }
    
    function startMic() {
        if (!recognition) {
            setStatus("Ses girişi desteklenmiyor", true);
            return;
        }
        if (isMicActive) return;
        isMicActive = true;
        recognition.start();
        setStatus("🎤 Dinliyorum, konuş...");
        document.getElementById("micToggleBtn").classList.add("mic-active");
        document.getElementById("micToggleBtn").innerHTML = "🎤 Mikrofon Açık";
        
        recognition.onresult = async (event) => {
            let transcript = "";
            for (let i = event.resultIndex; i < event.results.length; i++) {
                if (event.results[i].isFinal) {
                    transcript += event.results[i][0].transcript;
                }
            }
            if (transcript.trim() !== "") {
                document.getElementById("userInput").value = transcript;
                await sendMessage(transcript);
            }
        };
        recognition.onerror = (e) => {
            if (e.error !== "no-speech") {
                setStatus("Ses hatası: " + e.error, true);
            }
        };
        recognition.onend = () => {
            if (isMicActive) {
                recognition.start(); // Sürekli dinleme
            }
        };
    }
    
    function stopMic() {
        if (recognition && isMicActive) {
            isMicActive = false;
            recognition.stop();
            setStatus("🎤 Mikrofon kapalı");
            document.getElementById("micToggleBtn").classList.remove("mic-active");
            document.getElementById("micToggleBtn").innerHTML = "🎤 Mikrofon Kapalı";
        }
    }
    
    function toggleMic() {
        if (isMicActive) {
            stopMic();
        } else {
            startMic();
        }
    }
    
    // ==================== MESAJ GÖNDERME ====================
    async function sendMessage(text) {
        if (!text.trim()) return;
        document.getElementById("userInput").value = "";
        addMessage("user", text);
        setStatus("🤔 Düşünüyor...");
        
        // Bilgi ekleme kontrolü (sohbet mesajı olarak değil, hafızaya)
        const memoryPattern = /(doğum günüm|doğum günü|sevdiğim|sevdiğim renk|proje teslim|hatırla|adım|yaşım|sevgilimin adı|en sevdiğim|borçlu|alacaklı)\s+(.*?)$/i;
        const memoryMatch = text.match(memoryPattern);
        if (memoryMatch && !text.includes("?")) {
            const key = memoryMatch[1];
            const value = memoryMatch[2];
            addToMemory(key, value);
            addMessage("ai", `Tamam, hatırladım: ${key} = ${value}. Bunu unutmayacağım.`);
            speakText(`Tamam, hatırladım: ${key} = ${value}`);
            return;
        }
        
        // Hafızadan bilgi çek
        let memoryInfo = "";
        for (let k in userMemory) {
            if (text.toLowerCase().includes(k) || text.toLowerCase().includes("hatırla") || text.toLowerCase().includes("neydi")) {
                memoryInfo += `\n- ${k}: ${userMemory[k]}`;
            }
        }
        if (memoryInfo) {
            memoryInfo = "Kullanıcı hakkında hatırladıklarım:" + memoryInfo;
        }
        
        const reply = await askGroq(text, memoryInfo);
        addMessage("ai", reply);
        setStatus("✅ Cevap verildi");
        speakText(reply);
    }
    
    // ==================== OLAY BAĞLANTILARI ====================
    document.getElementById("sendBtn").onclick = () => {
        const input = document.getElementById("userInput");
        sendMessage(input.value);
        input.value = "";
    };
    document.getElementById("micToggleBtn").onclick = toggleMic;
    document.getElementById("newChatBtn").onclick = newChat;
    document.getElementById("historyBtn").onclick = showHistory;
    document.getElementById("closeHistory").onclick = () => {
        document.getElementById("historyPanel").classList.remove("open");
    };
    document.getElementById("memoryBtn").onclick = () => {
        let info = "📚 Bilgi Bankam:\n";
        for (let k in userMemory) {
            info += `- ${k}: ${userMemory[k]}\n`;
        }
        alert(info || "Henüz hiçbir bilgi kaydetmedin. '13 Nisan doğum günüm' dersen aklımda tutarım.");
    };
    document.getElementById("userInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
            document.getElementById("sendBtn").click();
        }
    });
    
    function setStatus(msg, isErr = false) {
        const statusDiv = document.getElementById("status");
        statusDiv.innerText = msg;
        if (isErr) {
            setTimeout(() => {
                if (statusDiv.innerText === msg) statusDiv.innerText = "Hazır";
            }, 4000);
        } else {
            setTimeout(() => {
                if (statusDiv.innerText === msg) statusDiv.innerText = "Hazır";
            }, 3000);
        }
    }
    
    // ==================== BAŞLAT ====================
    loadMemory();
    loadChats();
    
    if (chats[currentChatId]?.messages.length === 0) {
        setTimeout(() => {
            addMessage("ai", "Nova burada. Naber? Bugün nasıl geçti? Anlat dinleyeyim. İstersen bir bilgi ver, aklımda tutayım. Mesela '13 Nisan doğum günüm' de.");
            speakText("Nova burada. Naber? Anlat dinleyeyim.");
        }, 500);
    }
</script>
</body>
</html>
